<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D积分学习 | AP微积分AB+BC 教学版</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --bg: #0B1320;
            --card-bg: #F5F0E1;
            --text: #1E293B;
            --accent: #145DA0;
            --bc: #C9A227;
            --border: #D7CCB6;
            --shadow: 0 8px 26px rgba(11,19,32,0.16);
            --radius: 16px;
        }

            background: linear-gradient(180deg, #0B1320 0%, #111C2E 100%);

            height: 100vh;
            display: block;
            overflow: hidden;
        }
        .app-shell {
            display: grid;
            grid-template-columns: 232px minmax(0, 1fr);
            height: 100vh;

        .sidebar {

            flex-direction: column;
            background: #0B1320;

            color: #F8FAFC;
            box-shadow: 10px 0 28px rgba(11,19,32,0.32);
            z-index: 20;
        }
        .sidebar-brand {
            display: grid;
            grid-template-columns: 64px minmax(0, 1fr);
            align-items: center;
            gap: 12px;
            min-height: 94px;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(215,204,182,0.2);
        }
        .brand-mark {
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            border-radius: 8px;
            background: rgba(201,162,39,0.18);
            border: 1px solid rgba(201,162,39,0.42);
            color: #F5F0E1;
            font-size: 1.45rem;
            font-weight: 900;
        }
        .brand-copy strong {
            display: block;
            color: #C9A227;
            font-size: 0.86rem;
            line-height: 1.25;
            text-transform: uppercase;
        }
        .brand-copy span {
            display: block;
            margin-top: 4px;
            color: #D7CCB6;
            font-size: 0.7rem;
            letter-spacing: 0;
            text-transform: uppercase;
        }
        .workspace {
            min-width: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            text-align: left;
            padding: 14px 28px;
            background: #0B1320;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(215,204,182,0.24);

            box-shadow: 0 2px 16px rgba(11,19,32,0.28);

            background: linear-gradient(135deg, #F8FAFC, #C9A227);

        .header-title p {

            color: #D7CCB6;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .fake-icon-button {
            width: 38px;
            height: 38px;
            padding: 0;
            margin: 0;
            display: grid;
            place-items: center;
            border-radius: 8px;
            border: 1px solid rgba(201,162,39,0.34);
            background: rgba(245,240,225,0.08);
            color: #C9A227;
            font-size: 1rem;
            font-weight: 900;
        }
        .user-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 42px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(201,162,39,0.34);
            background: rgba(245,240,225,0.08);
            color: #F8FAFC;
        }
        .user-avatar {
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #C9A227;
            color: #0B1320;
            font-size: 0.76rem;
            font-weight: 900;
        }
        .user-chip strong,
        .user-chip small {
            display: block;
            line-height: 1.2;
        }
        .user-chip strong { font-size: 0.86rem; }
        .user-chip small { color: #D7CCB6; font-size: 0.68rem; }
        .nav {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 6px;
            flex-wrap: nowrap;
            padding: 18px 16px;
            background: transparent;
            backdrop-filter: none;
            border-bottom: 0;
            flex-shrink: 0;
            z-index: 10;
            box-shadow: none;
        }
        .nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            background: rgba(245,240,225,0.08);
            color: #D7CCB6;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: 0.3s;
            white-space: nowrap;
            border: 1px solid rgba(215,204,182,0.18);
            cursor: pointer;
        }
        .nav a::before {
            width: 22px;
            color: #C9A227;
            font-weight: 900;
            text-align: center;
        }
        .nav a[data-page="home"]::before { content: "⌂"; }
        .nav a[data-page="learn"]::before { content: "□"; }
        .nav a[data-page="visualLab"]::before { content: "⌁"; }
        .nav a[data-page="practice"]::before { content: "✎"; }
        .nav a[data-page="formulaMap"]::before { content: "∑"; }
        .nav a[data-page="mistakes"]::before { content: "!"; }
        .nav a:hover, .nav a.active {
            background: var(--accent);
            color: #F8FAFC;
            border-color: var(--accent);
            box-shadow: 0 2px 10px rgba(20,93,160,0.25);
        }
        .nav a.bc-link { background: rgba(201,162,39,0.16); color: #F5F0E1; }
        .nav a.bc-link:hover, .nav a.bc-link.active {
            background: var(--bc);
            color: #0B1320;
            border-color: var(--bc);
            box-shadow: 0 2px 10px rgba(201,162,39,0.24);
        }
        .sidebar-tools {
            margin-top: auto;
            padding: 16px;
            border-top: 1px solid rgba(215,204,182,0.18);
        }
        .sidebar-tools button {
            width: 100%;
            min-height: 40px;
            margin: 0 0 8px;
            border-radius: 8px;
            border: 1px solid rgba(215,204,182,0.24);
            background: rgba(245,240,225,0.08);
            color: #D7CCB6;
            text-align: left;
            font-weight: 800;
        }
        .sidebar-tools button.primary {
            background: #C9A227;
            border-color: #C9A227;
            color: #0B1320;
        }
        .observatory-status {
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(201,162,39,0.34);
            background: rgba(17,28,46,0.9);
            color: #D7CCB6;
        }
        .observatory-status span {
            display: block;
            margin-bottom: 6px;
            color: #C9A227;
            font-size: 0.68rem;
            font-weight: 900;
            text-transform: uppercase;
        }
        .observatory-status strong {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #F8FAFC;
            font-size: 0.78rem;
            line-height: 1.35;
        }
        .observatory-status strong::before {
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #2CB1BC;
        }
        .main-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .card {
            position: absolute;
            inset: 0;
            display: none;
            overflow-y: auto;
            padding: 24px;
            background: transparent;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .card.active {
            display: block;
            visibility: visible;
            opacity: 1;
        }
        .card-inner {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 24px;
            color: #1E293B;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #F8FAFC;
        }
        .badge.ab { background: linear-gradient(135deg, #145DA0, #2CB1BC); }
        .badge.bc { background: linear-gradient(135deg, #C9A227, #D7CCB6); color: #0B1320; }
        .badge.ext { background: linear-gradient(135deg, #0B3D6E, #C9A227); }
        .formula {
            background: #FFF9EA;
            padding: 14px 18px;
            border-radius: 10px;
            margin: 14px 0;
            border: 1px solid var(--border);
            font-size: 1.05rem;
            overflow-x: auto;
            color: #1E293B;
        }
        .video-wrap {
            margin: 15px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            aspect-ratio: 16 / 9;
            box-shadow: 0 2px 8px rgba(11,19,32,0.1);
            background: #0B1320;
        }
        .video-wrap iframe,
        .video-wrap video { width: 100%; height: 100%; border: 0; display: block; }
        .video-tools {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: -4px 0 14px;
            color: #475569;
            font-size: 0.85rem;
        }
        .video-tools a {
            display: inline-flex;
            align-items: center;
            padding: 7px 12px;
            border-radius: 20px;
            background: rgba(20,93,160,0.12);
            color: #0B3D6E;
            text-decoration: none;
            font-weight: 700;
            border: 1px solid rgba(20,93,160,0.24);
        }
        .video-tools a:hover { background: rgba(20,93,160,0.18); }
        .video-note {
            flex-basis: 100%;
            color: #475569;
            line-height: 1.5;
        }
        .model-block {
            margin: 16px 0 18px;
        }
        .model-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            color: #1E293B;
            font-weight: 800;
        }
        .compat-toggle {
            margin: 0;
            padding: 6px 12px;
            border-radius: 18px;
            font-size: 0.78rem;
            background: #FFF9EA;
            color: #475569;
        }
        .canvas-container {
            width: 100%;
            height: 380px;
            border: 2px solid #D7CCB6;
            border-radius: 12px;
            margin: 0;
            background: #FFF9EA;
            cursor: grab;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(11,19,32,0.04);
        }
        .compat-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .compat-status {
            position: absolute;
            top: 10px;
            left: 12px;
            z-index: 10;
            max-width: calc(100% - 24px);
            padding: 6px 10px;
            border-radius: 10px;
            background: rgba(255,249,234,0.94);
            color: #475569;
            font-size: 0.8rem;
            line-height: 1.45;
            pointer-events: none;
            box-shadow: 0 1px 8px rgba(11,19,32,0.12);
        }
        .canvas-container:active { cursor: grabbing; }
        .hint {
            position: absolute;
            bottom: 10px;
            left: 14px;
            color: #475569;
            font-size: 0.8rem;
            background: rgba(255,249,234,0.92);
            padding: 4px 10px;
            border-radius: 12px;
            z-index: 10;
        }
        button {
            padding: 9px 18px;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #D7CCB6;
            background: #FFF9EA;
            color: #475569;
            margin: 4px;
        }
        button.accent {
            background: var(--accent);
            color: #F8FAFC;
            border-color: var(--accent);
        }
        button.accent:hover {
            background: #0B3D6E;
            box-shadow: 0 2px 8px rgba(20,93,160,0.18);
        }
        button.bc-btn {
            background: var(--bc);
            color: #0B1320;
            border-color: var(--bc);
        }
        button.bc-btn:hover {
            background: #D7CCB6;
            box-shadow: 0 2px 8px rgba(201,162,39,0.2);
        }
        input[type="range"] { width: 150px; accent-color: var(--accent); }
        input[type="text"], input[type="number"], select {
            padding: 10px 14px;
            background: #FFF9EA;
            border: 2px solid #D7CCB6;
            border-radius: 8px;
            color: #1E293B;
            margin: 0 4px;
        }
        .result {
            margin-top: 10px;
            padding: 10px 16px;
            background: #FFF9EA;
            border-radius: 8px;
            color: #0B3D6E;
            font-weight: 700;
        }
        .quiz { margin-top: 20px; }
        .quiz h3 { color: #C9A227; margin-bottom: 8px; }
        .quiz button.ans-btn {
            padding: 4px 12px;
            font-size: 0.85rem;
            background: rgba(201,162,39,0.16);
            border: 1px solid rgba(201,162,39,0.36);
            color: #0B1320;
            margin-top: 4px;
        }
        .quiz button.ans-btn:hover { background: rgba(201,162,39,0.26); }
        .quiz .explanation {
            display: none;
            margin-top: 6px;
            padding: 8px 12px;
            background: #FFF9EA;
            border-left: 4px solid #2CB1BC;
            color: #1E293B;
            border-radius: 4px;
        }
        .tip {
            background: #FFF9EA;
            border-left: 4px solid #C9A227;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            color: #1E293B;
        }
        .explanation-section {
            background: #FFF9EA;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin: 12px 0;
        }
        .explanation-section h3 { color: #0B3D6E; margin-bottom: 8px; }
        .explanation-section p { color: #1E293B; margin-bottom: 6px; }
        .explanation-section ul { margin-left: 20px; color: #475569; }
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
            margin: 12px 0;
        }
        .lesson-card,
        .mistake-card,
        .practice-card {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #FFF9EA;
        }
        .lesson-card h4,
        .mistake-card h4,
        .practice-card h4 {
            margin-bottom: 8px;
            color: #0B3D6E;
        }
        .lesson-card p,
        .practice-card p { margin-bottom: 6px; }
        .lesson-card ul,
        .mistake-card ul,
        .practice-card ul { margin-left: 18px; }
        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
        }
        .topic-tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 9px;
            border-radius: 999px;
            border: 1px solid rgba(20,93,160,0.24);
            background: rgba(20,93,160,0.12);
            color: #0B3D6E;
            font-size: 0.75rem;
            font-weight: 800;
        }
        .topic-tag.ext { border-color: rgba(201,162,39,0.42); background: rgba(201,162,39,0.14); color: #0B1320; }
        .topic-tag.warn { border-color: rgba(162,62,72,0.3); background: rgba(162,62,72,0.1); color: #A23E48; }
        .method-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            overflow: hidden;
            border-radius: 10px;
        }
        .method-table th,
        .method-table td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }
        .method-table th {
            background: rgba(20, 93, 160, 0.12);
            color: #0B3D6E;
        }
        details.lesson-accordion {
            margin: 10px 0;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #FFF9EA;
            overflow: hidden;
        }
        details.lesson-accordion summary {
            cursor: pointer;
            padding: 12px 14px;
            font-weight: 800;
            color: #0B3D6E;
        }
        details.lesson-accordion > div {
            padding: 0 14px 14px;
        }
        .btn-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0 16px;
        }
        .site-hero {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
            gap: 22px;
            align-items: stretch;
            margin-bottom: 24px;
        }
        .hero-copy,
        .preview-card,
        .path-card,
        .tool-card,
        .lesson-shell,
        .page-intro {
            border: 1px solid #D7CCB6;
            background: #FFF9EA;
            border-radius: 14px;
            box-shadow: 0 10px 26px rgba(11,19,32,0.14);
        }
        .hero-copy {
            padding: 28px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .hero-copy h2 {
            font-size: clamp(2rem, 4vw, 4rem);
            line-height: 1.02;
            margin-bottom: 16px;
            color: #1E293B;
        }
        .hero-copy p,
        .page-intro p,
        .path-card p,
        .tool-card p,
        .lesson-description {
            color: #475569;
            line-height: 1.65;
        }
        .hero-actions,
        .card-actions,
        .lesson-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }
        .nav-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 9px 16px;
            border-radius: 24px;
            border: 1px solid rgba(20, 93, 160, 0.32);
            background: rgba(20, 93, 160, 0.12);
            color: #0B3D6E;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }
        .nav-button.primary {
            background: linear-gradient(135deg, #145DA0, #0B3D6E);
            color: #F8FAFC;
            border-color: transparent;
        }
        .nav-button.subtle {
            background: rgba(201,162,39,0.14);
            color: #0B1320;
        }
        .preview-card {
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 280px;
        }
        .preview-card h3,
        .section-title,
        .path-group h3,
        .tool-card h3,
        .path-card h4 {
            color: #0B3D6E;
        }
        .preview-formula {
            margin: 18px 0;
            padding: 16px;
            border-radius: 12px;
            background: #F5F0E1;
            border: 1px solid #D7CCB6;
            color: #1E293B;
            overflow-x: auto;
        }
        .section-title {
            margin: 22px 0 10px;
            font-size: 1.35rem;
        }
        .path-grid,
        .tool-grid {
            display: grid;

            gap: 14px;
            margin: 12px 0 20px;

        .tool-card {
            padding: 18px;

            display: flex;
            flex-direction: column;
        }
        .path-card.extension {
            opacity: 0.84;

        .tool-card ul {

        }

        .tool-card .card-actions {

            padding-top: 14px;
        }

            padding: 22px;
            margin-bottom: 20px;
        }
        .page-intro h2 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #1E293B;
        }
        .breadcrumb {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-bottom: 14px;
            color: #475569;
            font-size: 0.88rem;
            font-weight: 700;
        }
        .breadcrumb button {

            background: transparent;
            color: #145DA0;
            padding: 0;
            margin: 0;
            font-size: inherit;
        }

        }

            margin: 8px 0 10px;

            color: #1E293B;
        }
        .lesson-section {
            margin: 18px 0;
        }

            color: #0B3D6E;

        }

            border-radius: 12px;
            background: rgba(20, 93, 160, 0.1);
            border: 1px solid rgba(20, 93, 160, 0.22);

            font-size: 0.82rem;
            font-weight: 800;
        }

            background: rgba(162,62,72,0.12);

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const sceneData = {};
    const compatScenes = {};

    function createCompatScene(containerId, reason = '兼容模式') {
        const container = document.getElementById(containerId);
        if (!container) return null;
        const key = containerId.replace(/Canvas$/, '');
        container.innerHTML = '';

        const canvas = document.createElement('canvas');
        canvas.className = 'compat-canvas';
        const status = document.createElement('div');
        status.className = 'compat-status';
        status.textContent = `${reason}：拖动旋转，滚轮缩放`;
        container.appendChild(canvas);
        container.appendChild(status);

        const ctx = canvas.getContext('2d');
        const state = { rx: -0.65, ry: 0.75, zoom: 1, dragging: false, px: 0, py: 0 };
        const colors = {
            blue: '#2563eb',
            red: '#dc2626',
            gold: '#f59e0b',
            purple: '#7c3aed',
            green: '#10b981',
            cyan: '#0891b2',
            grid: '#dbe4ee',
            axisX: '#ef4444',
            axisY: '#16a34a',
            axisZ: '#2563eb'
        };

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const rect = container.getBoundingClientRect();
            canvas.width = Math.max(1, Math.floor(rect.width * dpr));
            canvas.height = Math.max(1, Math.floor(rect.height * dpr));
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            draw();
        }

        function project(x, y, z) {
            const cy = Math.cos(state.ry), sy = Math.sin(state.ry);
            const cx = Math.cos(state.rx), sx = Math.sin(state.rx);
            const x1 = x * cy - z * sy;
            const z1 = x * sy + z * cy;
            const y1 = y * cx - z1 * sx;
            const z2 = y * sx + z1 * cx;
            const rect = container.getBoundingClientRect();
            const scale = Math.min(rect.width, rect.height) * 0.16 * state.zoom;
            return {
                x: rect.width / 2 + x1 * scale,
                y: rect.height / 2 - y1 * scale,
                z: z2
            };
        }

        function path(points) {
            ctx.beginPath();
            points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        }

        function strokeLine(points, color, width = 2) {
            path(points.map(p => project(...p)));
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.stroke();
        }

        function fillPoly(points, color, alpha = 0.35, stroke = null) {
            const projected = points.map(p => project(...p));
            path(projected);
            ctx.closePath();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.fill();
            ctx.globalAlpha = 1;
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }

        function circlePoints(center, radius, plane = 'yz', count = 48) {
            const pts = [];
            for (let i = 0; i <= count; i++) {
                const a = i / count * Math.PI * 2;
                if (plane === 'yz') pts.push([center[0], center[1] + radius * Math.cos(a), center[2] + radius * Math.sin(a)]);
                if (plane === 'xz') pts.push([center[0] + radius * Math.cos(a), center[1], center[2] + radius * Math.sin(a)]);
                if (plane === 'xy') pts.push([center[0] + radius * Math.cos(a), center[1] + radius * Math.sin(a), center[2]]);
            }
            return pts;
        }

        function drawDisc(center, radius, color, alpha = 0.35) {
            fillPoly(circlePoints(center, radius, 'yz', 60), color, alpha, color);
        }

        function drawCylinderShell(radius, height, color, alpha = 0.24) {
            const bottom = circlePoints([0, 0, 0], radius, 'xz', 60);
            const top = circlePoints([0, height, 0], radius, 'xz', 60);
            for (let i = 0; i < bottom.length - 1; i += 6) {
                fillPoly([bottom[i], bottom[i + 1], top[i + 1], top[i]], color, alpha);
            }
            strokeLine(bottom, color, 1.5);
            strokeLine(top, color, 1.5);
            [[radius, 0], [-radius, 0], [0, radius], [0, -radius]].forEach(([x, z]) => {
                strokeLine([[x, 0, z], [x, height, z]], color, 1);
            });
        }

        function drawGridAndAxes() {
            for (let i = -4; i <= 4; i++) {
                strokeLine([[-4, 0, i], [4, 0, i]], colors.grid, 1);
                strokeLine([[i, 0, -4], [i, 0, 4]], colors.grid, 1);
            }
            strokeLine([[-4.2, 0, 0], [4.2, 0, 0]], colors.axisX, 2);
            strokeLine([[0, -2.2, 0], [0, 3.8, 0]], colors.axisY, 2);
            strokeLine([[0, 0, -4.2], [0, 0, 4.2]], colors.axisZ, 2);
        }

        function drawAreaModel() {
            const top = [], bottom = [];
            for (let i = 0; i <= 50; i++) {
                const t = i / 50;
                top.push([t * 3 - 1.5, t * 2.4 - 1.1, 0]);
                bottom.push([t * 3 - 1.5, t * t * 2.4 - 1.1, 0]);
            }
            fillPoly([...top, ...bottom.reverse()], colors.gold, 0.35, '#d97706');
            strokeLine(top, colors.blue, 3);
            strokeLine(bottom.reverse(), colors.red, 3);
            for (let i = 4; i <= 44; i += 7) {
                const t = i / 50;
                const x = t * 3 - 1.5, y1 = t * t * 2.4 - 1.1, y2 = t * 2.4 - 1.1;
                fillPoly([[x - 0.08, y1, 0.08], [x + 0.08, y1, 0.08], [x + 0.08, y2, 0.08], [x - 0.08, y2, 0.08]], colors.red, 0.5);
            }
        }

        function drawDiskModel() {
            for (let i = 0; i < 10; i++) {
                const x = -1.8 + i * 0.36;
                const r = 0.25 + i * 0.12;
                drawDisc([x, 0, 0], r, i % 2 ? colors.gold : colors.purple, 0.38);
            }
            strokeLine([[-1.95, 0, 0], [2.05, 0, 0]], colors.axisX, 2);
        }

        function drawWasherModel() {
            for (let i = 0; i < 8; i++) {
                const x = -1.6 + i * 0.45;
                drawDisc([x, 0, 0], 1.25, colors.blue, 0.18);
                drawDisc([x, 0, 0], 0.35 + i * 0.08, colors.red, 0.25);
            }
            strokeLine([[-1.9, 0, 0], [1.9, 0, 0]], colors.axisX, 2);
        }

        function drawCrossModel() {
            const x0 = -2, x1 = 2, y0 = -1, y1 = 1, z0 = -1, z1 = 1;
            const edges = [
                [[x0,y0,z0],[x1,y0,z0]], [[x0,y1,z0],[x1,y1,z0]], [[x0,y0,z1],[x1,y0,z1]], [[x0,y1,z1],[x1,y1,z1]],
                [[x0,y0,z0],[x0,y1,z0]], [[x1,y0,z0],[x1,y1,z0]], [[x0,y0,z1],[x0,y1,z1]], [[x1,y0,z1],[x1,y1,z1]],
                [[x0,y0,z0],[x0,y0,z1]], [[x1,y0,z0],[x1,y0,z1]], [[x0,y1,z0],[x0,y1,z1]], [[x1,y1,z0],[x1,y1,z1]]
            ];
            fillPoly([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]], colors.green, 0.12);
            edges.forEach(e => strokeLine(e, colors.green, 1.5));
            [-1.4, -0.5, 0.4, 1.3].forEach((x, i) => fillPoly([[x,y0,z0],[x,y1,z0],[x,y1,z1],[x,y0,z1]], i === 2 ? colors.gold : colors.red, 0.32));
        }

        function drawShellModel() {
            [0.45, 0.75, 1.05, 1.35].forEach((r, i) => drawCylinderShell(r, 0.45 + i * 0.35, colors.purple, 0.18));
        }

        function drawPolarModel() {
            const pts = [];
            for (let i = 0; i <= 160; i++) {
                const t = i / 160 * Math.PI * 2;
                const r = 1 + Math.cos(t);
                pts.push([r * Math.cos(t) * 1.35, 0, r * Math.sin(t) * 1.35]);
            }
            fillPoly(pts, colors.gold, 0.24, '#d97706');
            strokeLine(pts, colors.purple, 3);
            for (let i = 0; i < 8; i++) {
                const t = i / 8 * Math.PI * 2;
                const r = 1 + Math.cos(t);
                strokeLine([[0,0,0], [r * Math.cos(t) * 1.35, 0, r * Math.sin(t) * 1.35]], colors.gold, 1);
            }
        }

        function drawArcModel() {
            const pts = [];
            for (let i = 0; i <= 80; i++) {
                const x = i / 80 * 3.4 - 1.7;
                const raw = (x + 1.7) / 3.4 * 4;
                pts.push([x, Math.pow(raw, 1.5) / 3.2 - 1.2, 0]);
            }
            strokeLine(pts, colors.purple, 3);
            for (let i = 0; i < pts.length - 1; i += 10) strokeLine([pts[i], pts[i + 10]], colors.red, 2);
        }

        function drawSurfaceModel() {
            for (let x = -1.7; x <= 1.7; x += 0.22) {
                const r = Math.sqrt(Math.max(0.05, x + 1.8)) * 0.65;
                strokeLine(circlePoints([x, 0, 0], r, 'yz', 32), colors.cyan, 1);
            }
            const curve = [];
            for (let x = -1.7; x <= 1.7; x += 0.08) curve.push([x, Math.sqrt(x + 1.8) * 0.65, 0]);
            strokeLine(curve, colors.purple, 3);
        }

        function drawParametricModel() {
            for (let t = 0; t <= Math.PI; t += 0.18) {
                const x = 1.7 * Math.cos(t), r = Math.sin(t);
                strokeLine(circlePoints([x, 0, 0], r, 'yz', 32), colors.cyan, 1);
            }
            const curve = [];
            for (let t = 0; t <= Math.PI * 2; t += 0.06) curve.push([1.7 * Math.cos(t), Math.sin(t), 0]);
            strokeLine(curve, colors.purple, 3);
        }

        function draw() {
            const rect = container.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);
            ctx.fillStyle = '#f5f7fa';
            ctx.fillRect(0, 0, rect.width, rect.height);
            drawGridAndAxes();
            const drawers = {
                area: drawAreaModel,
                disk: drawDiskModel,
                washer: drawWasherModel,
                cross: drawCrossModel,
                shell: drawShellModel,
                polar: drawPolarModel,
                arc: drawArcModel,
                surface: drawSurfaceModel,
                parametric: drawParametricModel
            };
            (drawers[key] || drawAreaModel)();
        }

        canvas.addEventListener('pointerdown', (e) => {
            state.dragging = true;
            state.px = e.clientX;
            state.py = e.clientY;
            canvas.setPointerCapture?.(e.pointerId);
        });
        canvas.addEventListener('pointermove', (e) => {
            if (!state.dragging) return;
            state.ry += (e.clientX - state.px) * 0.012;
            state.rx += (e.clientY - state.py) * 0.012;
            state.rx = Math.max(-1.45, Math.min(1.1, state.rx));
            state.px = e.clientX;
            state.py = e.clientY;
            draw();
        });
        canvas.addEventListener('pointerup', (e) => {
            state.dragging = false;
            canvas.releasePointerCapture?.(e.pointerId);
        });
        canvas.addEventListener('pointerleave', () => { state.dragging = false; });
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            state.zoom *= e.deltaY > 0 ? 0.92 : 1.08;
            state.zoom = Math.max(0.55, Math.min(2.2, state.zoom));
            draw();
        }, { passive: false });

        const compat = { resize, draw, container };
        compatScenes[key] = compat;
        resize();

    function createScene(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return null;
        const w = container.clientWidth || 600;
        const h = container.clientHeight || 380;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f7fa);
        const cam = new THREE.PerspectiveCamera(50, w / h, 0.1, 100);
        cam.position.set(5, 4, 6);
        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ antialias: true });
        } catch (error) {
            createCompatScene(containerId, '当前浏览器无法创建 WebGL，已自动切换到兼容模型');
            return null;
        }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(w, h);
        renderer.domElement.style.display = 'block';
        container.appendChild(renderer.domElement);
        const controls = new OrbitControls(cam, renderer.domElement);
        controls.enableDamping = true;
        scene.add(new THREE.AmbientLight(0x8090b0, 0.8));
        const dir = new THREE.DirectionalLight(0xffffff, 1.0);
        dir.position.set(5, 8, 5);
        scene.add(dir);
        const dir2 = new THREE.DirectionalLight(0xaaccff, 0.4);
        dir2.position.set(-3, 2, -2);

        const grid = new THREE.GridHelper(8, 20, 0xccd5e0, 0xe8ecf1);
        scene.add(grid);
        const axes = new THREE.AxesHelper(4);
        scene.add(axes);

        let stopped = false;
        const animate = () => {
            if (stopped) return;
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, cam);
        };
        animate();
        return {
            scene, cam, renderer, controls, container, extra: {},
            stop() {
                stopped = true;
                controls.dispose();
                renderer.dispose();
            }
        };
    }

    function parseLabFunction(expr) {
        const source = expr.trim().replace(/\^/g, '**').replace(/π/g, 'pi');
        try {
            const fn = new Function('t', `
                const {
                    sin, cos, tan, asin, acos, atan, sqrt, cbrt, abs, log, log10,
                    exp, pow, min, max, floor, ceil, round, PI, E
                } = Math;
                const pi = PI;
                const x = t;
                const y = t;
                const theta = t;
                return (${source});
            `);
            const test = Number(fn(1));
            if (!Number.isFinite(test)) throw new Error('invalid value');
            return fn;
        } catch (error) {
            return null;
        }
    }

    function integrateLabTrapezoid(func, a, b, n = 240) {
        const h = (b - a) / n;
        let sum = 0.5 * (func(a) + func(b));
        for (let i = 1; i < n; i++) sum += func(a + i * h);
        return sum * h;
    }

    function labRawValue(func, t, fallback = 0) {
        const value = Number(func(t));
        return Number.isFinite(value) ? value : fallback;
    }

    function labValue(func, t, min = -12, max = 12) {
        return THREE.MathUtils.clamp(labRawValue(func, t), min, max);
    }

    // 数学半径：旋转体半径是点到旋转轴的距离，而不是函数值本身。
    function getRadiusToAxis(value, axisOffset = 0) {
        return Math.abs(value - axisOffset);
    }

    function getLabAxisOffset(lab = advancedLab) {
        return Number.isFinite(lab.axisOffset) ? lab.axisOffset : 0;
    }

    // Washer 的外/内半径按“到轴距离”自动排序，避免函数上下关系误导半径关系。
    function getWasherRadii(firstValue, secondValue, axisOffset = 0) {
        const firstRadius = getRadiusToAxis(firstValue, axisOffset);
        const secondRadius = getRadiusToAxis(secondValue, axisOffset);
        return {
            outer: Math.max(firstRadius, secondRadius),
            inner: Math.min(firstRadius, secondRadius),
            swapped: secondRadius > firstRadius
        };
    }

    function getBoundedRadius(func, t, max = 8, axisOffset = getLabAxisOffset()) {
        return THREE.MathUtils.clamp(getRadiusToAxis(labValue(func, t, -max, max), axisOffset), 0, max);
    }

    // 采样检测符号变化；用于提示需要分段，而不是替代精确求交点。
    function hasSignChange(func, a, b, samples = 80, epsilon = 1e-7) {
        let lastSign = 0;
        for (let i = 0; i <= samples; i++) {
            const t = a + (i / samples) * (b - a);
            const value = Number(func(t));
            if (!Number.isFinite(value) || Math.abs(value) <= epsilon) continue;
            const sign = Math.sign(value);
            if (lastSign && sign !== lastSign) return true;
            lastSign = sign;
        }
        return false;
    }

    function areaDifferenceChangesSign() {
        const lab = advancedLab;
        return hasSignChange(t => labRawValue(lab.f, t) - labRawValue(lab.g, t), lab.tMin, lab.tMax);
    }

    function parametricXDerivativeChangesSign() {
        const lab = advancedLab;
        return hasSignChange(t => labDerivative(lab.f, t), lab.tMin, lab.tMax, 90, 1e-5);
    }

    // 极坐标面积密度：signed r 直接平方；未来可传入内外两条极坐标曲线。
    function polarAreaDensity(outerRadius, innerRadius = 0) {
        return 0.5 * (outerRadius * outerRadius - innerRadius * innerRadius);
    }

    function labDerivative(func, t) {
        const lab = advancedLab;
        const span = Math.max(1e-4, Math.abs(lab.tMax - lab.tMin) * 1e-4);
        const left = Math.max(lab.tMin, t - span);
        const right = Math.min(lab.tMax, t + span);
        if (right <= left) return 0;
        return (labRawValue(func, right) - labRawValue(func, left)) / (right - left);
    }

    function formatLabLimit(value) {
        if (Math.abs(value) < 1e-9) return '0';
        if (Math.abs(value - Math.PI) < 1e-6) return 'π';
        if (Math.abs(value - TAU) < 1e-6) return '2π';
        return Number(value).toFixed(value % 1 === 0 ? 0 : 2);
    }

    function formatLabInterval() {
        return `[${formatLabLimit(advancedLab.tMin)},${formatLabLimit(advancedLab.tMax)}]`;
    }

    function computeLabMetric() {
        const lab = advancedLab;
        const axisOffset = getLabAxisOffset(lab);
        if (lab.mode === 'area') {
            return integrateLabTrapezoid(t => Math.abs(labRawValue(lab.f, t) - labRawValue(lab.g, t)), lab.tMin, lab.tMax, 320);
        }
        if (lab.mode === 'disk') {
            return Math.PI * integrateLabTrapezoid(t => getRadiusToAxis(labRawValue(lab.f, t), axisOffset) ** 2, lab.tMin, lab.tMax, 260);
        }
        if (lab.mode === 'washer') {
            return Math.PI * integrateLabTrapezoid(t => {
                const { outer, inner } = getWasherRadii(labRawValue(lab.f, t), labRawValue(lab.g, t), axisOffset);
                return outer * outer - inner * inner;
            }, lab.tMin, lab.tMax, 260);
        }
        if (lab.mode === 'shell') {
            return 2 * Math.PI * integrateLabTrapezoid(t => {
                const radius = Math.max(0, Math.abs(t));
                const height = Math.max(0, Math.abs(labRawValue(lab.f, t) - labRawValue(lab.g, t)));
                return radius * height;
            }, lab.tMin, lab.tMax, 240);
        }
        if (lab.mode === 'polar') {
            return integrateLabTrapezoid(t => polarAreaDensity(labRawValue(lab.f, t)), lab.tMin, lab.tMax, 320);
        }
        if (lab.mode === 'arc') {
            return integrateLabTrapezoid(t => Math.sqrt(1 + labDerivative(lab.f, t) ** 2), lab.tMin, lab.tMax, 320);
        }
        if (lab.mode === 'surface') {
            return 2 * Math.PI * integrateLabTrapezoid(t => {
                const radius = getRadiusToAxis(labRawValue(lab.f, t), axisOffset);
                return radius * Math.sqrt(1 + labDerivative(lab.f, t) ** 2);
            }, lab.tMin, lab.tMax, 320);
        }
        if (lab.mode === 'parametric') {
            const area = Math.abs(integrateLabTrapezoid(t => labRawValue(lab.g, t) * labDerivative(lab.f, t), lab.tMin, lab.tMax, 360));
            const volume = Math.PI * integrateLabTrapezoid(t => getRadiusToAxis(labRawValue(lab.g, t), axisOffset) ** 2 * Math.abs(labDerivative(lab.f, t)), lab.tMin, lab.tMax, 360);
            return { area, volume };
        }
        return integrateLabTrapezoid(t => {
            const base = Math.max(0, Math.abs(labRawValue(lab.f, t) - labRawValue(lab.g, t)));
            return base * base;
        }, lab.tMin, lab.tMax, 240);
    }

    function washerRadiiSwapDetected(samples = 80) {
        const lab = advancedLab;
        const axisOffset = getLabAxisOffset(lab);
        for (let i = 0; i <= samples; i++) {
            const t = lab.tMin + (i / samples) * (lab.tMax - lab.tMin);
            if (getWasherRadii(labRawValue(lab.f, t), labRawValue(lab.g, t), axisOffset).swapped) return true;
        }
        return false;
    }

    function getLabWarnings() {
        const lab = advancedLab;
        const warnings = [];
        if (lab.mode === 'area' && areaDifferenceChangesSign()) {
            warnings.push('检测到两曲线在区间内可能相交，系统已按 ∫|f-g| 计算面积。');
        }
        if (lab.mode === 'washer' && washerRadiiSwapDetected()) {
            warnings.push('检测到内外函数到旋转轴的距离顺序可能互换，系统已按距离自动识别外半径和内半径。');
        }
        if (lab.mode === 'parametric' && parametricXDerivativeChangesSign()) {
            warnings.push("检测到 x'(t) 可能变号：当前区间可能需要分段计算。");
        }
        return warnings;
    }

    function disposeLabObject(object) {
        object.traverse?.(child => {
            child.geometry?.dispose?.();
            if (Array.isArray(child.material)) child.material.forEach(mat => mat.dispose?.());
            else child.material?.dispose?.();
        });
    }

    function clearLabGroup(group) {
        while (group.children.length) {
            const child = group.children.pop();
            disposeLabObject(child);

    function addLabEdges(mesh, color = 0xffffff) {
        const edgesGeo = new THREE.EdgesGeometry(mesh.geometry);
        const edgesMat = new THREE.LineBasicMaterial({ color });
        mesh.add(new THREE.LineSegments(edgesGeo, edgesMat));
        return mesh;
