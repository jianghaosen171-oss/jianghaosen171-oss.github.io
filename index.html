<div class="header">

    <a data-page="area" class="active">📏 面积</a>
    <a data-page="disk">🔄 Disk</a>

    <a data-page="cross">📋 截面</a>
    <a data-page="shell" class="bc-link">🐚 Shell 拓展</a>
    <a data-page="polar" class="bc-link">📈 极坐标</a>
    <a data-page="arc" class="bc-link">📐 弧长</a>
    <a data-page="surface" class="bc-link">🌐 旋转面</a>
    <a data-page="parametric" class="bc-link">📊 参数方程</a>
    <a data-page="calc">🔢 计算器</a>

<div class="main-area" id="mainArea"></div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const sceneData = {};
    const compatScenes = {};

    function createCompatScene(containerId, reason = '兼容模式') {
        const container = document.getElementById(containerId);
        if (!container) return null;
        const key = containerId.replace(/Canvas$/, '');
        container.innerHTML = '';

        const canvas = document.createElement('canvas');
        canvas.className = 'compat-canvas';
        const status = document.createElement('div');
        status.className = 'compat-status';
        status.textContent = `${reason}：拖动旋转，滚轮缩放`;
        container.appendChild(canvas);
        container.appendChild(status);

        const ctx = canvas.getContext('2d');
        const state = { rx: -0.65, ry: 0.75, zoom: 1, dragging: false, px: 0, py: 0 };
        const colors = {
            blue: '#2563eb',
            red: '#dc2626',
            gold: '#f59e0b',
            purple: '#7c3aed',
            green: '#10b981',
            cyan: '#0891b2',
            grid: '#dbe4ee',
            axisX: '#ef4444',
            axisY: '#16a34a',
            axisZ: '#2563eb'
        };

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const rect = container.getBoundingClientRect();
            canvas.width = Math.max(1, Math.floor(rect.width * dpr));
            canvas.height = Math.max(1, Math.floor(rect.height * dpr));
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            draw();
        }

        function project(x, y, z) {
            const cy = Math.cos(state.ry), sy = Math.sin(state.ry);
            const cx = Math.cos(state.rx), sx = Math.sin(state.rx);
            const x1 = x * cy - z * sy;
            const z1 = x * sy + z * cy;
            const y1 = y * cx - z1 * sx;
            const z2 = y * sx + z1 * cx;
            const rect = container.getBoundingClientRect();
            const scale = Math.min(rect.width, rect.height) * 0.16 * state.zoom;
            return {
                x: rect.width / 2 + x1 * scale,
                y: rect.height / 2 - y1 * scale,
                z: z2
            };
        }

        function path(points) {
            ctx.beginPath();
            points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        }

        function strokeLine(points, color, width = 2) {
            path(points.map(p => project(...p)));
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.stroke();
        }

        function fillPoly(points, color, alpha = 0.35, stroke = null) {
            const projected = points.map(p => project(...p));
            path(projected);
            ctx.closePath();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.fill();
            ctx.globalAlpha = 1;
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }

        function circlePoints(center, radius, plane = 'yz', count = 48) {
            const pts = [];
            for (let i = 0; i <= count; i++) {
                const a = i / count * Math.PI * 2;
                if (plane === 'yz') pts.push([center[0], center[1] + radius * Math.cos(a), center[2] + radius * Math.sin(a)]);
                if (plane === 'xz') pts.push([center[0] + radius * Math.cos(a), center[1], center[2] + radius * Math.sin(a)]);
                if (plane === 'xy') pts.push([center[0] + radius * Math.cos(a), center[1] + radius * Math.sin(a), center[2]]);
            }
            return pts;
        }

        function drawDisc(center, radius, color, alpha = 0.35) {
            fillPoly(circlePoints(center, radius, 'yz', 60), color, alpha, color);
        }

        function drawCylinderShell(radius, height, color, alpha = 0.24) {
            const bottom = circlePoints([0, 0, 0], radius, 'xz', 60);
            const top = circlePoints([0, height, 0], radius, 'xz', 60);
            for (let i = 0; i < bottom.length - 1; i += 6) {
                fillPoly([bottom[i], bottom[i + 1], top[i + 1], top[i]], color, alpha);
            }
            strokeLine(bottom, color, 1.5);
            strokeLine(top, color, 1.5);
            [[radius, 0], [-radius, 0], [0, radius], [0, -radius]].forEach(([x, z]) => {
                strokeLine([[x, 0, z], [x, height, z]], color, 1);
            });
        }

        function drawGridAndAxes() {
            for (let i = -4; i <= 4; i++) {
                strokeLine([[-4, 0, i], [4, 0, i]], colors.grid, 1);
                strokeLine([[i, 0, -4], [i, 0, 4]], colors.grid, 1);
            }
            strokeLine([[-4.2, 0, 0], [4.2, 0, 0]], colors.axisX, 2);
            strokeLine([[0, -2.2, 0], [0, 3.8, 0]], colors.axisY, 2);
            strokeLine([[0, 0, -4.2], [0, 0, 4.2]], colors.axisZ, 2);
        }

        function drawAreaModel() {
            const top = [], bottom = [];
            for (let i = 0; i <= 50; i++) {
                const t = i / 50;
                top.push([t * 3 - 1.5, t * 2.4 - 1.1, 0]);
                bottom.push([t * 3 - 1.5, t * t * 2.4 - 1.1, 0]);
            }
            fillPoly([...top, ...bottom.reverse()], colors.gold, 0.35, '#d97706');
            strokeLine(top, colors.blue, 3);
            strokeLine(bottom.reverse(), colors.red, 3);
            for (let i = 4; i <= 44; i += 7) {
                const t = i / 50;
                const x = t * 3 - 1.5, y1 = t * t * 2.4 - 1.1, y2 = t * 2.4 - 1.1;
                fillPoly([[x - 0.08, y1, 0.08], [x + 0.08, y1, 0.08], [x + 0.08, y2, 0.08], [x - 0.08, y2, 0.08]], colors.red, 0.5);
            }
        }

        function drawDiskModel() {
            for (let i = 0; i < 10; i++) {
                const x = -1.8 + i * 0.36;
                const r = 0.25 + i * 0.12;
                drawDisc([x, 0, 0], r, i % 2 ? colors.gold : colors.purple, 0.38);
            }
            strokeLine([[-1.95, 0, 0], [2.05, 0, 0]], colors.axisX, 2);
        }

        function drawWasherModel() {
            for (let i = 0; i < 8; i++) {
                const x = -1.6 + i * 0.45;
                drawDisc([x, 0, 0], 1.25, colors.blue, 0.18);
                drawDisc([x, 0, 0], 0.35 + i * 0.08, colors.red, 0.25);
            }
            strokeLine([[-1.9, 0, 0], [1.9, 0, 0]], colors.axisX, 2);
        }

        function drawCrossModel() {
            const x0 = -2, x1 = 2, y0 = -1, y1 = 1, z0 = -1, z1 = 1;
            const edges = [
                [[x0,y0,z0],[x1,y0,z0]], [[x0,y1,z0],[x1,y1,z0]], [[x0,y0,z1],[x1,y0,z1]], [[x0,y1,z1],[x1,y1,z1]],
                [[x0,y0,z0],[x0,y1,z0]], [[x1,y0,z0],[x1,y1,z0]], [[x0,y0,z1],[x0,y1,z1]], [[x1,y0,z1],[x1,y1,z1]],
                [[x0,y0,z0],[x0,y0,z1]], [[x1,y0,z0],[x1,y0,z1]], [[x0,y1,z0],[x0,y1,z1]], [[x1,y1,z0],[x1,y1,z1]]
            ];
            fillPoly([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]], colors.green, 0.12);
            edges.forEach(e => strokeLine(e, colors.green, 1.5));
            [-1.4, -0.5, 0.4, 1.3].forEach((x, i) => fillPoly([[x,y0,z0],[x,y1,z0],[x,y1,z1],[x,y0,z1]], i === 2 ? colors.gold : colors.red, 0.32));
        }

        function drawShellModel() {
            [0.45, 0.75, 1.05, 1.35].forEach((r, i) => drawCylinderShell(r, 0.45 + i * 0.35, colors.purple, 0.18));
        }

        function drawPolarModel() {
            const pts = [];
            for (let i = 0; i <= 160; i++) {
                const t = i / 160 * Math.PI * 2;
                const r = 1 + Math.cos(t);
                pts.push([r * Math.cos(t) * 1.35, 0, r * Math.sin(t) * 1.35]);
            }
            fillPoly(pts, colors.gold, 0.24, '#d97706');
            strokeLine(pts, colors.purple, 3);
            for (let i = 0; i < 8; i++) {
                const t = i / 8 * Math.PI * 2;
                const r = 1 + Math.cos(t);
                strokeLine([[0,0,0], [r * Math.cos(t) * 1.35, 0, r * Math.sin(t) * 1.35]], colors.gold, 1);
            }
        }

        function drawArcModel() {
            const pts = [];
            for (let i = 0; i <= 80; i++) {
                const x = i / 80 * 3.4 - 1.7;
                const raw = (x + 1.7) / 3.4 * 4;
                pts.push([x, Math.pow(raw, 1.5) / 3.2 - 1.2, 0]);
            }
            strokeLine(pts, colors.purple, 3);
            for (let i = 0; i < pts.length - 1; i += 10) strokeLine([pts[i], pts[i + 10]], colors.red, 2);
        }

        function drawSurfaceModel() {
            for (let x = -1.7; x <= 1.7; x += 0.22) {
                const r = Math.sqrt(Math.max(0.05, x + 1.8)) * 0.65;
                strokeLine(circlePoints([x, 0, 0], r, 'yz', 32), colors.cyan, 1);
            }
            const curve = [];
            for (let x = -1.7; x <= 1.7; x += 0.08) curve.push([x, Math.sqrt(x + 1.8) * 0.65, 0]);
            strokeLine(curve, colors.purple, 3);
        }

        function drawParametricModel() {
            for (let t = 0; t <= Math.PI; t += 0.18) {
                const x = 1.7 * Math.cos(t), r = Math.sin(t);
                strokeLine(circlePoints([x, 0, 0], r, 'yz', 32), colors.cyan, 1);
            }
            const curve = [];
            for (let t = 0; t <= Math.PI * 2; t += 0.06) curve.push([1.7 * Math.cos(t), Math.sin(t), 0]);
            strokeLine(curve, colors.purple, 3);
        }

        function draw() {
            const rect = container.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);
            ctx.fillStyle = '#f5f7fa';
            ctx.fillRect(0, 0, rect.width, rect.height);
            drawGridAndAxes();
            const drawers = {
                area: drawAreaModel,
                disk: drawDiskModel,
                washer: drawWasherModel,
                cross: drawCrossModel,
                shell: drawShellModel,
                polar: drawPolarModel,
                arc: drawArcModel,
                surface: drawSurfaceModel,
                parametric: drawParametricModel
            };
            (drawers[key] || drawAreaModel)();
        }

        canvas.addEventListener('pointerdown', (e) => {
            state.dragging = true;
            state.px = e.clientX;
            state.py = e.clientY;
            canvas.setPointerCapture?.(e.pointerId);
        });
        canvas.addEventListener('pointermove', (e) => {
            if (!state.dragging) return;
            state.ry += (e.clientX - state.px) * 0.012;
            state.rx += (e.clientY - state.py) * 0.012;
            state.rx = Math.max(-1.45, Math.min(1.1, state.rx));
            state.px = e.clientX;
            state.py = e.clientY;
            draw();
        });
        canvas.addEventListener('pointerup', (e) => {
            state.dragging = false;
            canvas.releasePointerCapture?.(e.pointerId);
        });
        canvas.addEventListener('pointerleave', () => { state.dragging = false; });
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            state.zoom *= e.deltaY > 0 ? 0.92 : 1.08;
            state.zoom = Math.max(0.55, Math.min(2.2, state.zoom));
            draw();
        }, { passive: false });

        const compat = { resize, draw, container };
        compatScenes[key] = compat;
        resize();
        return compat;
    }

    function createScene(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return null;
        const w = container.clientWidth || 600;
        const h = container.clientHeight || 380;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f7fa);
        const cam = new THREE.PerspectiveCamera(50, w / h, 0.1, 100);
        cam.position.set(5, 4, 6);
        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ antialias: true });
        } catch (error) {
            createCompatScene(containerId, '当前浏览器无法创建 WebGL，已自动切换到兼容模型');
            return null;
        }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(w, h);
        renderer.domElement.style.display = 'block';
        container.appendChild(renderer.domElement);
        const controls = new OrbitControls(cam, renderer.domElement);
        controls.enableDamping = true;
        scene.add(new THREE.AmbientLight(0x8090b0, 0.8));
        const dir = new THREE.DirectionalLight(0xffffff, 1.0);
        dir.position.set(5, 8, 5);
        scene.add(dir);
        const dir2 = new THREE.DirectionalLight(0xaaccff, 0.4);
        dir2.position.set(-3, 2, -2);
        scene.add(dir2);
        const grid = new THREE.GridHelper(8, 20, 0xccd5e0, 0xe8ecf1);
        scene.add(grid);
        const axes = new THREE.AxesHelper(4);
        scene.add(axes);

        let stopped = false;
        const animate = () => {
            if (stopped) return;
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, cam);
        };
        animate();
        return {
            scene, cam, renderer, controls, container, extra: {},
            stop() {
                stopped = true;
                controls.dispose();
                renderer.dispose();
            }
        };
    }

    function resizeScene(d) {
        if (!d || !d.renderer || !d.container) return;
        const w = d.container.clientWidth;
        const h = d.container.clientHeight;
        if (w > 0 && h > 0) {
            d.renderer.setSize(w, h);
            d.cam.aspect = w / h;
            d.cam.updateProjectionMatrix();
        }
    }

    function createCylinderBetween(start, end, radius, material) {
        const direction = new THREE.Vector3().subVectors(end, start);
        const length = direction.length();
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 8), material);
        mesh.position.copy(start).add(end).multiplyScalar(0.5);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
        return mesh;
    }

    function parseLabFunction(expr) {
        const source = expr.trim().replace(/\^/g, '**').replace(/π/g, 'pi');
        try {
            const fn = new Function('t', `
                const {
                    sin, cos, tan, asin, acos, atan, sqrt, cbrt, abs, log, log10,
                    exp, pow, min, max, floor, ceil, round, PI, E
                } = Math;
                const pi = PI;
                const x = t;
                const y = t;
                const theta = t;
                return (${source});
            `);
            const test = Number(fn(1));
            if (!Number.isFinite(test)) throw new Error('invalid value');
            return fn;
        } catch (error) {
            return null;
        }
    }

    function integrateLabTrapezoid(func, a, b, n = 240) {
        const h = (b - a) / n;
        let sum = 0.5 * (func(a) + func(b));
        for (let i = 1; i < n; i++) sum += func(a + i * h);
        return sum * h;
    }

    function labRawValue(func, t, fallback = 0) {
        const value = Number(func(t));
        return Number.isFinite(value) ? value : fallback;
    }

    function labValue(func, t, min = -12, max = 12) {
        return THREE.MathUtils.clamp(labRawValue(func, t), min, max);
    }

    // 数学半径：旋转体半径是点到旋转轴的距离，而不是函数值本身。
    function getRadiusToAxis(value, axisOffset = 0) {
        return Math.abs(value - axisOffset);
    }

    function getLabAxisOffset(lab = advancedLab) {
        return Number.isFinite(lab.axisOffset) ? lab.axisOffset : 0;
    }

    // Washer 的外/内半径按“到轴距离”自动排序，避免函数上下关系误导半径关系。
    function getWasherRadii(firstValue, secondValue, axisOffset = 0) {
        const firstRadius = getRadiusToAxis(firstValue, axisOffset);
        const secondRadius = getRadiusToAxis(secondValue, axisOffset);
        return {
            outer: Math.max(firstRadius, secondRadius),
            inner: Math.min(firstRadius, secondRadius),
            swapped: secondRadius > firstRadius
        };
    }

    function getBoundedRadius(func, t, max = 8, axisOffset = getLabAxisOffset()) {
        return THREE.MathUtils.clamp(getRadiusToAxis(labValue(func, t, -max, max), axisOffset), 0, max);
    }

    // 采样检测符号变化；用于提示需要分段，而不是替代精确求交点。
    function hasSignChange(func, a, b, samples = 80, epsilon = 1e-7) {
        let lastSign = 0;
        for (let i = 0; i <= samples; i++) {
            const t = a + (i / samples) * (b - a);
            const value = Number(func(t));
            if (!Number.isFinite(value) || Math.abs(value) <= epsilon) continue;
            const sign = Math.sign(value);
            if (lastSign && sign !== lastSign) return true;
            lastSign = sign;
        }
        return false;
    }

    function areaDifferenceChangesSign() {
        const lab = advancedLab;
        return hasSignChange(t => labRawValue(lab.f, t) - labRawValue(lab.g, t), lab.tMin, lab.tMax);
    }

    function parametricXDerivativeChangesSign() {
        const lab = advancedLab;
        return hasSignChange(t => labDerivative(lab.f, t), lab.tMin, lab.tMax, 90, 1e-5);
    }

    // 极坐标面积密度：signed r 直接平方；未来可传入内外两条极坐标曲线。
    function polarAreaDensity(outerRadius, innerRadius = 0) {
        return 0.5 * (outerRadius * outerRadius - innerRadius * innerRadius);
    }

    function labDerivative(func, t) {
        const lab = advancedLab;
        const span = Math.max(1e-4, Math.abs(lab.tMax - lab.tMin) * 1e-4);
        const left = Math.max(lab.tMin, t - span);
        const right = Math.min(lab.tMax, t + span);
        if (right <= left) return 0;
        return (labRawValue(func, right) - labRawValue(func, left)) / (right - left);
    }

    function formatLabLimit(value) {
        if (Math.abs(value) < 1e-9) return '0';
        if (Math.abs(value - Math.PI) < 1e-6) return 'π';
        if (Math.abs(value - TAU) < 1e-6) return '2π';
        return Number(value).toFixed(value % 1 === 0 ? 0 : 2);
    }

    function formatLabInterval() {
        return `[${formatLabLimit(advancedLab.tMin)},${formatLabLimit(advancedLab.tMax)}]`;
    }

    function computeLabMetric() {
        const lab = advancedLab;
        const axisOffset = getLabAxisOffset(lab);
        if (lab.mode === 'area') {
            return integrateLabTrapezoid(t => Math.abs(labRawValue(lab.f, t) - labRawValue(lab.g, t)), lab.tMin, lab.tMax, 320);
        }
        if (lab.mode === 'disk') {
            return Math.PI * integrateLabTrapezoid(t => getRadiusToAxis(labRawValue(lab.f, t), axisOffset) ** 2, lab.tMin, lab.tMax, 260);
        }
        if (lab.mode === 'washer') {
            return Math.PI * integrateLabTrapezoid(t => {
                const { outer, inner } = getWasherRadii(labRawValue(lab.f, t), labRawValue(lab.g, t), axisOffset);
                return outer * outer - inner * inner;
            }, lab.tMin, lab.tMax, 260);
        }
        if (lab.mode === 'shell') {
            return 2 * Math.PI * integrateLabTrapezoid(t => {
                const radius = Math.max(0, Math.abs(t));
                const height = Math.max(0, Math.abs(labRawValue(lab.f, t) - labRawValue(lab.g, t)));
                return radius * height;
            }, lab.tMin, lab.tMax, 240);
        }
        if (lab.mode === 'polar') {
            return integrateLabTrapezoid(t => polarAreaDensity(labRawValue(lab.f, t)), lab.tMin, lab.tMax, 320);
        }
        if (lab.mode === 'arc') {
            return integrateLabTrapezoid(t => Math.sqrt(1 + labDerivative(lab.f, t) ** 2), lab.tMin, lab.tMax, 320);
        }
        if (lab.mode === 'surface') {
            return 2 * Math.PI * integrateLabTrapezoid(t => {
                const radius = getRadiusToAxis(labRawValue(lab.f, t), axisOffset);
                return radius * Math.sqrt(1 + labDerivative(lab.f, t) ** 2);
            }, lab.tMin, lab.tMax, 320);
        }
        if (lab.mode === 'parametric') {
            const area = Math.abs(integrateLabTrapezoid(t => labRawValue(lab.g, t) * labDerivative(lab.f, t), lab.tMin, lab.tMax, 360));
            const volume = Math.PI * integrateLabTrapezoid(t => getRadiusToAxis(labRawValue(lab.g, t), axisOffset) ** 2 * Math.abs(labDerivative(lab.f, t)), lab.tMin, lab.tMax, 360);
            return { area, volume };
        }
        return integrateLabTrapezoid(t => {
            const base = Math.max(0, Math.abs(labRawValue(lab.f, t) - labRawValue(lab.g, t)));
            return base * base;
        }, lab.tMin, lab.tMax, 240);
    }

    function washerRadiiSwapDetected(samples = 80) {
        const lab = advancedLab;
        const axisOffset = getLabAxisOffset(lab);
        for (let i = 0; i <= samples; i++) {
            const t = lab.tMin + (i / samples) * (lab.tMax - lab.tMin);
            if (getWasherRadii(labRawValue(lab.f, t), labRawValue(lab.g, t), axisOffset).swapped) return true;
        }
        return false;
    }

    function getLabWarnings() {
        const lab = advancedLab;
        const warnings = [];
        if (lab.mode === 'area' && areaDifferenceChangesSign()) {
            warnings.push('检测到两曲线在区间内可能相交，系统已按 ∫|f-g| 计算面积。');
        }
        if (lab.mode === 'washer' && washerRadiiSwapDetected()) {
            warnings.push('检测到内外函数到旋转轴的距离顺序可能互换，系统已按距离自动识别外半径和内半径。');
        }
        if (lab.mode === 'parametric' && parametricXDerivativeChangesSign()) {
            warnings.push("检测到 x'(t) 可能变号：当前区间可能需要分段计算。");
        }
        return warnings;
    }

    function updateLabInfoUI() {
        const lab = advancedLab;
        const volumeEl = labEl('VolumeValue');
        const metricEl = labEl('MetricLabel');
        const unitEl = labEl('UnitLabel');
        const modeEl = labEl('ModeName');
        const axisEl = labEl('AxisName');
        const formulaEl = labEl('FormulaTxt');
        const warningEl = labEl('WarningMsg');
        if (!volumeEl || !modeEl || !axisEl || !formulaEl) return;

        const meta = labModeMeta[lab.mode] || labModeMeta.area;
        const variable = lab.axis === 'x' ? 'x' : 'y';
        const metric = computeLabMetric();
        modeEl.textContent = meta.name;
        axisEl.textContent = meta.axis ? (lab.axis === 'x' ? meta.axisX : meta.axisY) : '无旋转轴';
        formulaEl.innerHTML = meta.formula(variable)
            .replace('[a,b]', formatLabInterval())
            .replace('[α,β]', formatLabInterval());
        if (lab.mode === 'parametric') {
            volumeEl.textContent = `A≈${metric.area.toFixed(3)} / V≈${metric.volume.toFixed(3)}`;
        } else {
            volumeEl.textContent = metric.toFixed(3);
        }
        if (metricEl) metricEl.textContent = meta.metric;
        if (unitEl) unitEl.textContent = meta.unit;
        if (warningEl) {
            const warnings = getLabWarnings();
            warningEl.textContent = warnings.join(' ');
            warningEl.style.display = warnings.length ? 'block' : 'none';
        }
    }

    function disposeLabObject(object) {
        object.traverse?.(child => {
            child.geometry?.dispose?.();
            if (Array.isArray(child.material)) child.material.forEach(mat => mat.dispose?.());
            else child.material?.dispose?.();
        });
    }

    function clearLabGroup(group) {
        while (group.children.length) {
            const child = group.children.pop();
            disposeLabObject(child);
        }
    }

    function addLabEdges(mesh, color = 0xffffff) {
        const edgesGeo = new THREE.EdgesGeometry(mesh.geometry);
        const edgesMat = new THREE.LineBasicMaterial({ color });
        mesh.add(new THREE.LineSegments(edgesGeo, edgesMat));
        return mesh;
    }

    // Washer 几何：把外半径-内半径的环形截面沿厚度挤出，得到真实中空垫圈。
    function createLabHollowCylinder(outerRadius, innerRadius, height, radialSegments = 56, heightSegments = 1) {
        const outerR = Math.max(0.001, outerRadius);
        const innerR = THREE.MathUtils.clamp(innerRadius, 0.001, outerR - 0.001);
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        const indices = [];
        const ringSize = radialSegments + 1;

        for (let yIndex = 0; yIndex <= heightSegments; yIndex++) {
            const y = -height / 2 + (yIndex / heightSegments) * height;
            for (let i = 0; i <= radialSegments; i++) {
                const theta = (i / radialSegments) * TAU;
                vertices.push(outerR * Math.cos(theta), y, outerR * Math.sin(theta));
            }
        }

        const innerOffset = vertices.length / 3;
        for (let yIndex = 0; yIndex <= heightSegments; yIndex++) {
            const y = -height / 2 + (yIndex / heightSegments) * height;
            for (let i = 0; i <= radialSegments; i++) {
                const theta = (i / radialSegments) * TAU;
                vertices.push(innerR * Math.cos(theta), y, innerR * Math.sin(theta));
            }
        }

        for (let yIndex = 0; yIndex < heightSegments; yIndex++) {
            for (let i = 0; i < radialSegments; i++) {
                const a = yIndex * ringSize + i;
                const b = a + 1;
                const c = (yIndex + 1) * ringSize + i;
                const d = c + 1;
                indices.push(a, b, c, b, d, c);

                const ia = innerOffset + yIndex * ringSize + i;
                const ib = ia + 1;
                const ic = innerOffset + (yIndex + 1) * ringSize + i;
                const id = ic + 1;
                indices.push(ia, ic, ib, ib, ic, id);
            }
        }

        const topOuter = heightSegments * ringSize;
        const topInner = innerOffset + heightSegments * ringSize;
        const bottomOuter = 0;
        const bottomInner = innerOffset;
        for (let i = 0; i < radialSegments; i++) {
            const topOuterA = topOuter + i;
            const topOuterB = topOuterA + 1;
            const topInnerA = topInner + i;
            const topInnerB = topInnerA + 1;
            indices.push(topOuterA, topOuterB, topInnerA, topOuterB, topInnerB, topInnerA);

            const bottomOuterA = bottomOuter + i;
            const bottomOuterB = bottomOuterA + 1;
            const bottomInnerA = bottomInner + i;
            const bottomInnerB = bottomInnerA + 1;
            indices.push(bottomOuterA, bottomInnerA, bottomOuterB, bottomOuterB, bottomInnerA, bottomInnerB);
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
    }

    function makeLabFanMesh(points, material) {
        if (points.length < 3) return null;
        const vertices = [];
        const indices = [];
        points.forEach(point => vertices.push(point.x, point.y, point.z));
        for (let i = 1; i < points.length - 1; i++) indices.push(0, i, i + 1);
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return new THREE.Mesh(geometry, material);
    }

    function makeLabShapeMesh(points, color, opacity = 0.28) {
        if (points.length < 3) return null;
        const shape = new THREE.Shape();
        shape.moveTo(points[0].x, points[0].y);
        points.slice(1).forEach(point => shape.lineTo(point.x, point.y));
        shape.closePath();
        return new THREE.Mesh(
            new THREE.ShapeGeometry(shape),
            new THREE.MeshStandardMaterial({
                color,
                side: THREE.DoubleSide,
                transparent: true,
                opacity,
                roughness: 0.42
            })
        );
    }

    function makeRevolutionGeometry(radiusFunc, a, b, axis = 'x', tSegments = 92, radialSegments = 48, axisOffset = 0) {
        const vertices = [];
        const indices = [];
        for (let i = 0; i <= tSegments; i++) {
            const t = a + (i / tSegments) * (b - a);
            const radius = getRadiusToAxis(labValue(radiusFunc, t, -8, 8), axisOffset);
            for (let j = 0; j <= radialSegments; j++) {
                const angle = (j / radialSegments) * TAU;
                if (axis === 'x') {
                    vertices.push(t, radius * Math.cos(angle), radius * Math.sin(angle));
                } else {
                    vertices.push(radius * Math.cos(angle), t, radius * Math.sin(angle));
                }
            }
        }
        const row = radialSegments + 1;
        for (let i = 0; i < tSegments; i++) {
            for (let j = 0; j < radialSegments; j++) {
                const a1 = i * row + j;
                const b1 = a1 + row;
                indices.push(a1, b1, a1 + 1, b1, b1 + 1, a1 + 1);
            }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
    }

    function makeParametricRevolutionGeometry(xFunc, yFunc, a, b, tSegments = 128, radialSegments = 42, axisOffset = 0) {
        const vertices = [];
        const indices = [];
        for (let i = 0; i <= tSegments; i++) {
            const t = a + (i / tSegments) * (b - a);
            const x = labValue(xFunc, t, -8, 8);
            const radius = getRadiusToAxis(labValue(yFunc, t, -6, 6), axisOffset);
            for (let j = 0; j <= radialSegments; j++) {
                const angle = (j / radialSegments) * TAU;
                vertices.push(x, radius * Math.cos(angle), radius * Math.sin(angle));
            }
        }
        const row = radialSegments + 1;
        for (let i = 0; i < tSegments; i++) {
            for (let j = 0; j < radialSegments; j++) {
                const a1 = i * row + j;
                const b1 = a1 + row;
                indices.push(a1, b1, a1 + 1, b1, b1 + 1, a1 + 1);
            }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
    }

    function graphPointForLab(func, t) {
        const lab = advancedLab;
        const value = labValue(func, t, -8, 8);
        if (lab.mode === 'shell' && lab.axis === 'x') {
            return new THREE.Vector3(value, t, 0);
        }
        if (lab.mode === 'area' || lab.mode === 'shell' && lab.axis === 'y' || lab.axis === 'x') {
            return new THREE.Vector3(t, value, 0);
        }
        return new THREE.Vector3(value, t, 0);
    }

    function buildLabSlices() {
        const lab = advancedLab;
        clearLabGroup(lab.sliceGroup);
        const halfStep = lab.sliceStep / 2;
        const axisOffset = getLabAxisOffset(lab);

        if (lab.mode === 'area') {
            const upper = [];
            const lower = [];
            for (let i = 0; i <= 150; i++) {
                const t = lab.tMin + (i / 150) * (lab.tMax - lab.tMin);
                const a = labValue(lab.f, t, -8, 8);
                const b = labValue(lab.g, t, -8, 8);
                upper.push(new THREE.Vector2(t, Math.max(a, b)));
                lower.push(new THREE.Vector2(t, Math.min(a, b)));
            }
            const region = makeLabShapeMesh([...upper, ...lower.reverse()], 0xfacc15, 0.26);
            if (region) {
                region.position.z = -0.03;
                lab.sliceGroup.add(region);
            }

            const sliceMat = new THREE.MeshStandardMaterial({
                color: 0xf59e0b,
                emissive: 0x4a2a00,
                transparent: true,
                opacity: 0.72,
                roughness: 0.38
            });

            if (lab.axis === 'x') {
                for (let t = lab.tMin; t <= lab.tMax - halfStep; t += lab.sliceStep) {
                    const center = t + halfStep;
                    const a = labValue(lab.f, center, -8, 8);
                    const b = labValue(lab.g, center, -8, 8);
                    const high = Math.max(a, b);
                    const low = Math.min(a, b);
                    const height = high - low;
                    if (height < 0.025) continue;
                    const bar = new THREE.Mesh(new THREE.BoxGeometry(lab.sliceStep * 0.82, height, 0.18), sliceMat);
                    bar.position.set(center, low + height / 2, 0.08);
                    lab.sliceGroup.add(addLabEdges(bar, 0xfff2aa));
                }
            } else {
                const yMin = Math.min(...upper.map(p => p.y), ...lower.map(p => p.y));
                const yMax = Math.max(...upper.map(p => p.y), ...lower.map(p => p.y));
                const stripStep = Math.max(0.08, (yMax - yMin) / 16);
                for (let y = yMin; y <= yMax - stripStep / 2; y += stripStep) {
                    const centerY = y + stripStep / 2;
                    const xs = [];
                    for (let i = 0; i <= 220; i++) {
                        const t = lab.tMin + (i / 220) * (lab.tMax - lab.tMin);
                        const a = labValue(lab.f, t, -8, 8);
                        const b = labValue(lab.g, t, -8, 8);
                        if (centerY >= Math.min(a, b) && centerY <= Math.max(a, b)) xs.push(t);
                    }
                    if (xs.length < 2) continue;
                    const minX = Math.min(...xs);
                    const maxX = Math.max(...xs);
                    const width = maxX - minX;
                    if (width < 0.025) continue;
                    const bar = new THREE.Mesh(new THREE.BoxGeometry(width, stripStep * 0.82, 0.18), sliceMat);
                    bar.position.set(minX + width / 2, centerY, 0.08);
                    lab.sliceGroup.add(addLabEdges(bar, 0xfff2aa));
                }
            }
            return;
        }

        if (lab.mode === 'shell') {
            const shellMat = new THREE.MeshStandardMaterial({
                color: 0xa855f7,
                emissive: 0x2d145f,
                roughness: 0.35,
                metalness: 0.05,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.44
            });
            for (let t = lab.tMin; t <= lab.tMax - halfStep; t += lab.sliceStep) {
                const center = t + halfStep;
                const a = labValue(lab.f, center, -8, 8);
                const b = labValue(lab.g, center, -8, 8);
                const low = Math.min(a, b);
                const height = Math.abs(a - b);
                const radius = Math.min(7.6, Math.max(0.06, Math.abs(center)));
                if (height < 0.035) continue;
                const shell = new THREE.Mesh(
                    new THREE.CylinderGeometry(radius, radius, height, 72, 1, true, -Math.PI * 0.18, TAU * 0.78),
                    shellMat
                );
                if (lab.axis === 'y') {
                    shell.position.set(0, low + height / 2, 0);
                } else {
                    shell.rotation.z = Math.PI / 2;
                    shell.position.set(low + height / 2, 0, 0);
                }
                lab.sliceGroup.add(addLabEdges(shell, 0xd8b4fe));
            }
            return;
        }

        if (lab.mode === 'polar') {
            const sectorCount = Math.max(8, Math.ceil((lab.tMax - lab.tMin) / lab.sliceStep));
            for (let s = 0; s < sectorCount; s++) {
                const start = lab.tMin + (s / sectorCount) * (lab.tMax - lab.tMin);
                const end = lab.tMin + ((s + 1) / sectorCount) * (lab.tMax - lab.tMin);
                const points = [new THREE.Vector3(0, 0.02, 0)];
                for (let i = 0; i <= 6; i++) {
                    const theta = start + (i / 6) * (end - start);
                    const radius = labValue(lab.f, theta, -4.5, 4.5);
                    points.push(new THREE.Vector3(radius * Math.cos(theta), 0.02, radius * Math.sin(theta)));
                }
                const mesh = makeLabFanMesh(
                    points,
                    new THREE.MeshStandardMaterial({
                        color: s % 2 ? 0x22d3ee : 0x38bdf8,
                        emissive: 0x07364a,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.55
                    })
                );
                if (mesh) {
                    lab.sliceGroup.add(addLabEdges(mesh, 0xbef6ff));
                    lab.sliceGroup.add(new THREE.Line(
                        new THREE.BufferGeometry().setFromPoints([...points.slice(1), points[0], points[1]]),
                        new THREE.LineBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.42 })
                    ));
                }
            }
            return;
        }

        if (lab.mode === 'arc') {
            const ribbonPts = [];
            const baselinePts = [];
            for (let i = 0; i <= 120; i++) {
                const t = lab.tMin + (i / 120) * (lab.tMax - lab.tMin);
                ribbonPts.push(new THREE.Vector2(t, Math.max(0, labValue(lab.f, t, -8, 8))));
                baselinePts.push(new THREE.Vector2(t, 0));
            }
            const ribbon = makeLabShapeMesh([...ribbonPts, ...baselinePts.reverse()], 0x38bdf8, 0.2);
            if (ribbon) {
                ribbon.position.z = -0.12;
                ribbon.material.emissive = new THREE.Color(0x075985);
                lab.sliceGroup.add(ribbon);
            }

            const segmentMat = new THREE.MeshBasicMaterial({ color: 0xfff176 });
            const pointMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const guideMat = new THREE.MeshBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.48 });
            const segments = Math.max(8, Math.round((lab.tMax - lab.tMin) / lab.sliceStep));
            let previous = null;
            for (let i = 0; i <= segments; i++) {
                const t = lab.tMin + (i / segments) * (lab.tMax - lab.tMin);
                const point = new THREE.Vector3(t, labValue(lab.f, t, -8, 8), 0.03);
                const bead = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), pointMat);
                bead.position.copy(point);
                lab.sliceGroup.add(bead);
                if (i % 2 === 0 && point.y > 0.05) {
                    lab.sliceGroup.add(createCylinderBetween(new THREE.Vector3(t, 0, 0.02), point, 0.015, guideMat));
                }
                if (previous) lab.sliceGroup.add(createCylinderBetween(previous, point, 0.06, segmentMat));
                previous = point;
            }
            return;
        }

        if (lab.mode === 'surface') {
            const surface = new THREE.Mesh(
                makeRevolutionGeometry(lab.f, lab.tMin, lab.tMax, lab.axis, 96, 56, axisOffset),
                new THREE.MeshStandardMaterial({
                    color: 0x14b8a6,
                    emissive: 0x063f3a,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.58,
                    roughness: 0.28,
                    metalness: 0.08
                })
            );
            lab.sliceGroup.add(addLabEdges(surface, 0x99f6e4));
            for (let t = lab.tMin; t <= lab.tMax; t += lab.sliceStep * 1.7) {
                const radius = getBoundedRadius(lab.f, t, 8, axisOffset);
                if (radius < 0.05) continue;
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(radius, 0.025, 10, 80),
                    new THREE.MeshBasicMaterial({ color: 0xccfbf1, transparent: true, opacity: 0.52 })
                );
                if (lab.axis === 'x') {
                    ring.rotation.y = Math.PI / 2;
                    ring.position.set(t, 0, 0);
                } else {
                    ring.rotation.x = Math.PI / 2;
                    ring.position.set(0, t, 0);
                }
                lab.sliceGroup.add(ring);
            }
            return;
        }

        if (lab.mode === 'parametric') {
            const points = [];
            for (let i = 0; i <= 180; i++) {
                const t = lab.tMin + (i / 180) * (lab.tMax - lab.tMin);
                points.push(new THREE.Vector2(labValue(lab.f, t, -8, 8), labValue(lab.g, t, -8, 8)));
            }
            const areaMesh = makeLabShapeMesh(points, 0x60a5fa, 0.24);
            if (areaMesh) {
                areaMesh.position.z = -0.08;
                lab.sliceGroup.add(areaMesh);
            }
            const surface = new THREE.Mesh(
                makeParametricRevolutionGeometry(lab.f, lab.g, lab.tMin, lab.tMax, 128, 42, axisOffset),
                new THREE.MeshStandardMaterial({
                    color: 0x818cf8,
                    emissive: 0x272a72,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.36,
                    roughness: 0.32
                })
            );
            lab.sliceGroup.add(addLabEdges(surface, 0xc7d2fe));
            return;
        }

        for (let t = lab.tMin; t <= lab.tMax - halfStep; t += lab.sliceStep) {
            if (lab.mode === 'cs') {
                const a = labValue(lab.f, t + halfStep, -8, 8);
                const b = labValue(lab.g, t + halfStep, -8, 8);
                const base = Math.max(0, Math.abs(a - b));
                if (base < 0.02) continue;
                const geo = lab.axis === 'x'
                    ? new THREE.BoxGeometry(lab.sliceStep * 0.98, base, Math.max(0.08, base))
                    : new THREE.BoxGeometry(Math.max(0.08, base), lab.sliceStep * 0.98, base);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x3b82f6,
                    emissive: 0x0a2a5a,
                    roughness: 0.35,
                    transparent: true,
                    opacity: 0.75
                });
                const box = new THREE.Mesh(geo, mat);
                if (lab.axis === 'x') box.position.set(t + halfStep, Math.min(a, b) + base / 2, 0);
                else box.position.set(Math.min(a, b) + base / 2, t + halfStep, 0);
                lab.sliceGroup.add(addLabEdges(box, 0xcceeff));
                continue;
            }

            if (lab.mode === 'disk') {
                const radius = getBoundedRadius(lab.f, t + halfStep, 8, axisOffset);
                if (radius <= 0.01) continue;
                const geo = new THREE.CylinderGeometry(radius, radius, lab.sliceStep * 0.98, 42);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x22c55e,
                    emissive: 0x064e3b,
                    roughness: 0.3,
                    metalness: 0.2,
                    transparent: true,
                    opacity: 0.72
                });
                const cylinder = new THREE.Mesh(geo, mat);
                if (lab.axis === 'x') {
                    cylinder.rotation.z = Math.PI / 2;
                    cylinder.position.set(t + halfStep, 0, 0);
                } else {
                    cylinder.position.set(0, t + halfStep, 0);
                }
                lab.sliceGroup.add(addLabEdges(cylinder, 0xaaffaa));
                continue;
            }

            const fValue = labValue(lab.f, t + halfStep, -8, 8);
            const gValue = labValue(lab.g, t + halfStep, -8, 8);
            const { outer, inner } = getWasherRadii(fValue, gValue, axisOffset);
            if (outer <= 0.02 || outer <= inner) continue;
            const thickness = lab.sliceStep * 0.98;
            const washerGeo = createLabHollowCylinder(outer, inner, thickness, 64, 2);
            const washerMat = new THREE.MeshStandardMaterial({
                color: 0xf97316,
                emissive: 0x4a2200,
                roughness: 0.4,
                metalness: 0.18,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.84
            });
            const washer = new THREE.Mesh(washerGeo, washerMat);
            if (lab.axis === 'x') {
                washer.rotation.z = Math.PI / 2;
                washer.position.set(t + halfStep, 0, 0);
            } else {
                washer.position.set(0, t + halfStep, 0);
            }
            lab.sliceGroup.add(addLabEdges(washer, 0xffaa77));
        }
    }

    function rebuildLabCurves() {
        const lab = advancedLab;
        clearLabGroup(lab.curveLinesGroup);
        const axisOffset = getLabAxisOffset(lab);

        if (lab.mode === 'polar') {
            const points = [];
            for (let i = 0; i <= 260; i++) {
                const t = lab.tMin + (i / 260) * (lab.tMax - lab.tMin);
                const radius = labValue(lab.f, t, -4.5, 4.5);
                points.push(new THREE.Vector3(radius * Math.cos(t), 0.08, radius * Math.sin(t)));
            }
            lab.curveLinesGroup.add(new THREE.Line(
                new THREE.BufferGeometry().setFromPoints(points),
                new THREE.LineBasicMaterial({ color: 0xfff7ad })
            ));
            const origin = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            origin.position.set(0, 0.08, 0);
            lab.curveLinesGroup.add(origin);
            return;
        }

        if (lab.mode === 'arc') {
            const points = [];
            for (let i = 0; i <= 220; i++) {
                const t = lab.tMin + (i / 220) * (lab.tMax - lab.tMin);
                points.push(new THREE.Vector3(t, labValue(lab.f, t, -8, 8), 0));
            }
            lab.curveLinesGroup.add(new THREE.Mesh(
                new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 180, 0.14, 14, false),
                new THREE.MeshBasicMaterial({ color: 0xff4d6d })
            ));
            return;
        }

        if (lab.mode === 'parametric') {
            const points = [];
            for (let i = 0; i <= 260; i++) {
                const t = lab.tMin + (i / 260) * (lab.tMax - lab.tMin);
                points.push(new THREE.Vector3(labValue(lab.f, t, -8, 8), labValue(lab.g, t, -8, 8), 0.05));
            }
            lab.curveLinesGroup.add(new THREE.Mesh(
                new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 220, 0.035, 10, true),
                new THREE.MeshStandardMaterial({ color: 0xff7777, emissive: 0x552020 })
            ));
            return;
        }

        const pointsF = [];
        const pointsG = [];
        for (let i = 0; i <= 220; i++) {
            const t = lab.tMin + (i / 220) * (lab.tMax - lab.tMin);
            pointsF.push(graphPointForLab(lab.f, t));
            pointsG.push(graphPointForLab(lab.g, t));
        }
        const curveF = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(pointsF),
            new THREE.LineBasicMaterial({ color: 0xff6666 })
        );
        const curveG = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(pointsG),
            new THREE.LineBasicMaterial({ color: 0x66ccff })
        );
        lab.curveLinesGroup.add(curveF, curveG);

        const redMat = new THREE.MeshStandardMaterial({ color: 0xff8888 });
        const blueMat = new THREE.MeshStandardMaterial({ color: 0x88aaff });
        [graphPointForLab(lab.f, lab.tMin), graphPointForLab(lab.f, lab.tMax)].forEach(point => {
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), redMat);
            sphere.position.copy(point);
            lab.curveLinesGroup.add(sphere);
        });
        [graphPointForLab(lab.g, lab.tMin), graphPointForLab(lab.g, lab.tMax)].forEach(point => {
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), blueMat);
            sphere.position.copy(point);
            lab.curveLinesGroup.add(sphere);
        });

        const mid = (lab.tMin + lab.tMax) / 2;
        const ringRad = lab.mode === 'washer'
            ? getWasherRadii(labValue(lab.f, mid, -8, 8), labValue(lab.g, mid, -8, 8), axisOffset).outer
            : getBoundedRadius(lab.f, mid, 8, axisOffset);
        if ((lab.mode === 'disk' || lab.mode === 'washer' || lab.mode === 'surface') && ringRad > 0.2 && ringRad < 12) {
            const ring = new THREE.Mesh(
                new THREE.TorusGeometry(ringRad, 0.045, 64, 160),
                new THREE.MeshStandardMaterial({ color: 0x77aaff, emissive: 0x225588, transparent: true, opacity: 0.35 })
            );
            if (lab.axis === 'x') {
                ring.position.set(mid, 0, 0);
                ring.rotation.y = Math.PI / 2;
            } else {
                ring.position.set(0, mid, 0);
                ring.rotation.x = Math.PI / 2;
            }
            lab.curveLinesGroup.add(ring);
        }
    }

    function initLabHelpers() {
        const lab = advancedLab;
        if (lab.helpersInitialized) return;
        const grid = new THREE.GridHelper(18, 22, 0x4b6e8f, 0x2a3a5a);
        grid.position.y = -1.6;
        grid.material.transparent = true;
        grid.material.opacity = 0.3;
        lab.scene.add(grid);

        lab.scene.add(
            new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(-0.5, 0, 0), 9.5, 0xff7777, 0.6, 0.3),
            new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, -1.2, 0), 7.2, 0x77ff77, 0.6, 0.3),
            new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, -1.2, -3), 6.5, 0x7777ff, 0.6, 0.3)
        );

        const makeLabel = (text, pos, color) => {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontSize = '18px';
            div.style.fontWeight = 'bold';
            div.style.textShadow = '1px 1px 0 #000';
            div.style.background = 'rgba(0,0,0,0.5)';
            div.style.padding = '2px 8px';
            div.style.borderRadius = '24px';
            div.style.backdropFilter = 'blur(5px)';
            const label = new CSS2DObject(div);
            label.position.copy(pos);
            lab.scene.add(label);
        };
        makeLabel('X', new THREE.Vector3(9.2, -0.3, 0), '#ffaaaa');
        makeLabel('Y', new THREE.Vector3(0, 6.4, 0), '#aaffaa');
        makeLabel('Z', new THREE.Vector3(0, -0.3, 5.6), '#aaaaff');
        makeLabel('O', new THREE.Vector3(-0.4, -0.4, -0.3), '#cccccc');
        lab.helpersInitialized = true;
    }

    function refreshAdvancedLab() {
        buildLabSlices();
        rebuildLabCurves();
        updateLabPanelState();
        updateLabInfoUI();
    }

    function updateLabPanelState() {
        const lab = advancedLab;
        const meta = labModeMeta[lab.mode] || labModeMeta.area;
        const titleEl = labEl('PanelTitle');
        const axisWrap = labEl('AxisSelector');
        const fLabel = labEl('FuncFLabel');
        const gLabel = labEl('FuncGLabel');
        const modeNote = labEl('ModeNote');
        const root = labEl('Root');
        if (titleEl) titleEl.textContent = `${meta.name} · 3D互动模型`;
        if (axisWrap) axisWrap.style.display = meta.axis ? 'flex' : 'none';
        if (fLabel) fLabel.textContent = meta.fLabel;
        if (gLabel) gLabel.textContent = meta.gLabel;
        if (modeNote) modeNote.textContent = meta.note;
        const axisX = labEl('AxisXBtn');
        const axisY = labEl('AxisYBtn');
        if (axisX) {
            axisX.textContent = meta.axisX || 'X 轴';
            axisX.classList.toggle('active', lab.axis === 'x');
        }
        if (axisY) {
            axisY.textContent = meta.axisY || 'Y 轴';
            axisY.classList.toggle('active', lab.axis === 'y');
        }
        root?.querySelectorAll('[data-lab-mode]').forEach(button => {
            button.classList.toggle('active', button.dataset.labMode === lab.mode);
        });
    }

    function setLabAxis(axis) {
        const lab = advancedLab;
        lab.axis = axis;
        labEl('AxisXBtn')?.classList.toggle('active', axis === 'x');
        labEl('AxisYBtn')?.classList.toggle('active', axis === 'y');
        refreshAdvancedLab();
        if (axis === 'y') lab.controls.target.set(0, 4.2, 0);
        else lab.controls.target.set(4.2, 1.5, 0);
        lab.controls.update();
    }

    function setLabMode(mode) {
        const presetPage = labModePresetPage[mode] || advancedLab.page || 'area';
        if (presetPage !== advancedLab.page && content[presetPage]) {
            switchPage(presetPage);
            document.querySelector('.main-area')?.scrollTo({ top: 0, behavior: 'smooth' });
            return;
        }
        applyLabPreset(presetPage);
        refreshAdvancedLab();
        resetLabView();
    }

    function resetLabView() {
        const lab = advancedLab;
        if (!lab.camera || !lab.controls) return;
        if (lab.mode === 'polar' || lab.mode === 'parametric') {
            lab.camera.position.set(5.8, 6.2, 8.2);
            lab.controls.target.set(0, 0.8, 0);
        } else if (lab.mode === 'arc') {
            lab.camera.position.set(8.5, 5.8, 8.2);
            lab.controls.target.set(4.1, 2.2, 0);
        } else if (lab.axis === 'x') {
            lab.camera.position.set(11, 8.5, 13.5);
            lab.controls.target.set(4.2, 1.5, 0);
        } else {
            lab.camera.position.set(9, 7, 12);
            lab.controls.target.set(0, 4.2, 0);
        }
        lab.controls.update();
    }

    function applyLabPreset(page) {
        const preset = advancedLabPresets[page] || advancedLabPresets.area;
        advancedLab.presetKey = page;
        advancedLab.mode = preset.mode;
        advancedLab.axis = preset.axis;
        advancedLab.f = parseLabFunction(preset.f) || advancedLab.f;
        advancedLab.g = parseLabFunction(preset.g) || advancedLab.g;
        advancedLab.tMin = preset.tMin ?? 0;
        advancedLab.tMax = preset.tMax ?? 8;
        advancedLab.sliceStep = preset.sliceStep ?? 0.38;
        advancedLab.csDepth = preset.csDepth ?? 1;
        advancedLab.axisOffset = preset.axisOffset ?? 0;
        const fInput = labEl('FuncF');
        const gInput = labEl('FuncG');
        if (fInput) fInput.value = preset.f;
        if (gInput) gInput.value = preset.g;
        labEl('AxisXBtn')?.classList.toggle('active', preset.axis === 'x');
        labEl('AxisYBtn')?.classList.toggle('active', preset.axis === 'y');
        updateLabPanelState();
    }

    function destroyAdvancedLab() {
        const lab = advancedLab;
        if (lab.animationFrame) cancelAnimationFrame(lab.animationFrame);
        lab.animationFrame = null;
        lab.observer?.disconnect?.();
        lab.observer = null;
        lab.controls?.dispose?.();
        if (lab.scene) {
            disposeLabObject(lab.scene);
            lab.scene.clear();
        }
        lab.renderer?.dispose?.();
        lab.renderer?.domElement?.remove?.();
        lab.labelRenderer?.domElement?.remove?.();
        lab.initialized = false;
        lab.page = null;
        lab.prefix = '';
        lab.scene = null;
        lab.camera = null;
        lab.renderer = null;
        lab.labelRenderer = null;
        lab.controls = null;
        lab.sliceGroup = null;
        lab.curveLinesGroup = null;
        lab.helpersInitialized = false;
    }

    function resizeAdvancedLab() {
        const lab = advancedLab;
        const viewport = labEl('Viewport');
        if (!lab.renderer || !lab.camera || !viewport) return;
        const rect = viewport.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;
        lab.renderer.setSize(rect.width, rect.height);
        lab.labelRenderer?.setSize(rect.width, rect.height);
        lab.camera.aspect = rect.width / rect.height;
        lab.camera.updateProjectionMatrix();
    }

    function initAdvancedLab(page = 'area') {
        if (!advancedLabPresets[page]) return;
        if (advancedLab.initialized && advancedLab.page === page) {
            resizeAdvancedLab();
            return;
        }
        destroyAdvancedLab();
        const lab = advancedLab;
        lab.page = page;
        lab.prefix = `lab-${page}-`;
        const viewport = labEl('Viewport');
        if (!viewport) return;
        lab.initialized = true;
        viewport.innerHTML = '';
        lab.scene = new THREE.Scene();
        lab.scene.background = new THREE.Color(0x0a0f1e);
        lab.scene.fog = new THREE.FogExp2(0x0a0f1e, 0.008);
        lab.camera = new THREE.PerspectiveCamera(48, 1, 0.1, 500);
        lab.camera.position.set(11, 8.5, 13.5);
        lab.sliceGroup = new THREE.Group();
        lab.curveLinesGroup = new THREE.Group();

        try {
            lab.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        } catch (error) {
            viewport.innerHTML = '<div class="lab-fallback"><div><h2>当前浏览器无法创建 WebGL</h2><p>这个高级模型需要浏览器支持 WebGL。请用 Chrome / Safari 打开，或开启硬件加速。</p></div></div>';
            return;
        }
        lab.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        lab.renderer.shadowMap.enabled = true;
        viewport.appendChild(lab.renderer.domElement);

        lab.labelRenderer = new CSS2DRenderer();
        lab.labelRenderer.domElement.style.position = 'absolute';
        lab.labelRenderer.domElement.style.inset = '0';
        lab.labelRenderer.domElement.style.pointerEvents = 'none';
        viewport.appendChild(lab.labelRenderer.domElement);

        lab.controls = new OrbitControls(lab.camera, lab.renderer.domElement);
        lab.controls.enableDamping = true;
        lab.controls.dampingFactor = 0.06;
        lab.controls.rotateSpeed = 1.0;
        lab.controls.zoomSpeed = 1.2;
        lab.controls.panSpeed = 0.8;
        lab.controls.target.set(4.2, 1.5, 0);

        lab.scene.add(new THREE.AmbientLight(0x404060, 0.55));
        const mainLight = new THREE.DirectionalLight(0xfff2e0, 1.2);
        mainLight.position.set(6, 12, 5);
        lab.scene.add(mainLight);
        [[0x4488ff, -2, 4, 5, 0.4], [0xffaa66, 5, 2, -6, 0.35], [0xffaa88, 8, 3, -4, 0.5]].forEach(([color, x, y, z, intensity]) => {
            const light = new THREE.PointLight(color, intensity);
            light.position.set(x, y, z);
            lab.scene.add(light);
        });

        lab.scene.add(lab.sliceGroup, lab.curveLinesGroup);
        applyLabPreset(page);
        initLabHelpers();

        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(1400 * 3);
        for (let i = 0; i < 1400; i++) {
            starPos[i * 3] = (Math.random() - 0.5) * 220;
            starPos[i * 3 + 1] = (Math.random() - 0.5) * 120;
            starPos[i * 3 + 2] = (Math.random() - 0.5) * 130 - 50;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        lab.scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x88aadd, size: 0.07, transparent: true, opacity: 0.5 })));

        labEl('Root')?.querySelectorAll('[data-lab-mode]').forEach(button => {
            button.onclick = () => setLabMode(button.dataset.labMode);
        });
        labEl('BtnReset').onclick = resetLabView;
        labEl('AxisXBtn').onclick = () => setLabAxis('x');
        labEl('AxisYBtn').onclick = () => setLabAxis('y');
        labEl('UpdateEqBtn').onclick = () => {
            const fInput = labEl('FuncF');
            const gInput = labEl('FuncG');
            const newF = parseLabFunction(fInput.value);
            const newG = parseLabFunction(gInput.value);
            const error = labEl('EqErrorMsg');
            if (!newF || !newG) {
                error.textContent = `⚠️ ${!newF ? 'f(t) 无效 ' : ''}${!newG ? 'g(t) 无效' : ''}，保留原函数`;
                error.style.display = 'block';
                setTimeout(() => error.style.display = 'none', 3000);
                return;
            }
            lab.f = newF;
            lab.g = newG;
            error.style.display = 'none';
            refreshAdvancedLab();
        };
        labEl('FuncF').addEventListener('keypress', e => { if (e.key === 'Enter') labEl('UpdateEqBtn').click(); });
        labEl('FuncG').addEventListener('keypress', e => { if (e.key === 'Enter') labEl('UpdateEqBtn').click(); });

        resizeAdvancedLab();
        resetLabView();
        refreshAdvancedLab();
        lab.observer = new ResizeObserver(resizeAdvancedLab);
        lab.observer.observe(viewport);

        const animateLab = () => {
            lab.animationFrame = requestAnimationFrame(animateLab);
            if (!lab.renderer) return;
            lab.controls.update();
            lab.renderer.render(lab.scene, lab.camera);
            lab.labelRenderer.render(lab.scene, lab.camera);
        };
        animateLab();
    }

    function initAreaScene() {
        const d = createScene('areaCanvas');
        if (!d) return;
        const { scene, extra } = d;
        const shape = new THREE.Shape();
        for (let i = 0; i <= 40; i++) { const t = i / 40; shape.lineTo(t, t); }
        for (let i = 40; i >= 0; i--) { const t = i / 40; shape.lineTo(t, t * t); }
        shape.closePath();
        scene.add(new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide, transparent: true, opacity: 0.25 })));
        const upPts = [], loPts = [];
        for (let t = 0; t <= 1; t += 0.02) { upPts.push(new THREE.Vector3(t, t, 0)); loPts.push(new THREE.Vector3(t, t * t, 0)); }
        scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(upPts), 100, 0.02, 8, false), new THREE.MeshBasicMaterial({ color: 0x2563eb })));
        scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(loPts), 100, 0.02, 8, false), new THREE.MeshBasicMaterial({ color: 0xdc2626 })));
        const vertG = new THREE.Group(), horizG = new THREE.Group();
        for (let x = 0.08; x < 1; x += 0.14) {
            const h = x - x * x;
            if (h < 0.02) continue;
            const bar = new THREE.Mesh(new THREE.BoxGeometry(0.08, h, 0.1), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
            bar.position.set(x, x * x + h / 2, 0); vertG.add(bar);
        }
        for (let y = 0.08; y < 1; y += 0.14) {
            const w = Math.sqrt(y) - y;
            if (w < 0.02) continue;
            const bar = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, 0.1), new THREE.MeshBasicMaterial({ color: 0x3b82f6 }));
            bar.position.set(y + w / 2, y, 0); horizG.add(bar);
        }
        horizG.visible = false;
        scene.add(vertG); scene.add(horizG);
        extra.vertG = vertG; extra.horizG = horizG; extra.current = 'vertical';
        sceneData.area = d;
    }

    function initDiskScene() {
        const d = createScene('diskCanvas');
        if (!d) return;
        const { scene, extra } = d;
        const cone = new THREE.Mesh(new THREE.ConeGeometry(2, 2, 48), new THREE.MeshPhysicalMaterial({ color: 0x8b5cf6, transparent: true, opacity: 0.45 }));
        cone.rotation.z = Math.PI / 2; cone.position.x = 1; scene.add(cone);
        const diskG = new THREE.Group();
        function createDisks(n) {
            while (diskG.children.length) diskG.remove(diskG.children[0]);
            const dx = 2 / n;
            for (let i = 0; i < n; i++) {
                const x = dx * (i + 0.5), r = x;
                if (r < 0.02) continue;
                const disk = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dx * 0.9, 32), new THREE.MeshPhysicalMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.7 }));
                disk.rotation.z = Math.PI / 2; disk.position.x = x;
                diskG.add(disk);
            }
        }
        createDisks(12); scene.add(diskG);
        extra.diskG = diskG; extra.createDisks = createDisks; extra.visible = true;
        sceneData.disk = d;
    }

    function initWasherScene() {
        const d = createScene('washerCanvas');
        if (!d) return;
        const { scene, extra } = d;
        const outer = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 2, 64), new THREE.MeshPhysicalMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.35 }));
        outer.rotation.z = Math.PI / 2; outer.position.x = 1; scene.add(outer);
        const inner = new THREE.Mesh(new THREE.ConeGeometry(2, 2, 48), new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 }));
        inner.rotation.z = Math.PI / 2; inner.position.x = 1; scene.add(inner);

                { q: 'y=x^(3/2) 从x=0到x=4的弧长约为？', a: '9.073', explanation: "f'(x) = (3/2)x^(1/2)，1+[f'(x)]² = 1 + (9/4)x。弧长 = ∫₀⁴ √(1+9x/4) dx。令u=1+9x/4，得 (8/27)[10^(3/2)-1] ≈ 9.073。" }
            ]
        },
        surface: {
            badge: 'bc', title: '八、旋转曲面面积',
            explanation: `
                <h3>📖 原理说明</h3>
                <p>曲线 \(y=f(x)\) 绕x轴旋转时，曲线上每个微小弧段 \(ds\) 扫出一个窄圆环带。该圆环的周长 = \(2\pi r\)，其中 \(r\) 是曲线到旋转轴的距离，宽度 = \(ds\)，因此环带面积 = \(2\pi r\,ds\)。</p>
                <p>其中 \(ds = \sqrt{1+[f'(x)]^2} dx\)。积分所有环带即得整个旋转曲面的表面积。</p>
                <p>注意：若曲线位于x轴下方，半径应取到轴距离，例如绕x轴时为 \(|f(x)|\)，不是把负函数值归零。</p>
            `,
            formula: `\\[ S = 2\\pi \\int_{a}^{b} \\bigl|f(x)-\\text{axis}\\bigr| \\sqrt{1 + [f'(x)]^2} \\, dx \\]`,
            quiz: [
                { q: 'y=√x 绕x轴旋转，x∈[0,4]的表面积约为？', a: '36.177', explanation: "f(x)=√x，f'(x)=1/(2√x)，1+[f']² = 1+1/(4x)。积分 S = 2π∫₀⁴ √x √(1+1/(4x)) dx = 2π∫₀⁴ √(x+1/4) dx ≈ 36.177。" }
            ]
        },
        parametric: {
            badge: 'bc', title: '九、参数方程下的面积与体积',
            explanation: `
                <h3>📖 原理说明</h3>
                <p>若曲线由参数方程 \(x=x(t), y=y(t)\) 给出（\(t \in [\alpha, \beta]\)），则面积微元 \(dA = y dx = y(t) x'(t) dt\)（假设 \(x'(t)>0\) 或处理正负）。</p>
                <p>旋转体积：绕x轴旋转时，体积微元 \(dV = \pi y^2 dx = \pi [y(t)]^2 x'(t) dt\)，积分即可。</p>
                <p><strong>重要：</strong>参数方程用于面积/体积时，需要检查 \(x(t)\) 或 \(y(t)\) 是否在区间内单调；如果导数变号，通常要分段，否则可能重复计算。</p>
                <p>面积常用 \(\left|\int y(t)x'(t)dt\right|\)，但若曲线重复描绘或方向复杂，需要分段并检查方向。</p>
            `,
            formula: `面积：\\[ A = \\left|\\int_{\\alpha}^{\\beta} y(t) \\, x'(t) \\, dt\\right| \\] 旋转体积：\\[ V = \\pi \\int_{\\alpha}^{\\beta} [\\text{dist}(y(t),\\text{axis})]^2 \\, |x'(t)| \\, dt \\]`,
            quiz: [
                { q: '椭圆 x=2cos t, y=sin t (0≤t≤2π) 的面积？', a: '2π', explanation: "x'(t) = -2sin t，面积 = ∫₀^{2π} y(t)x'(t) dt = ∫₀^{2π} sin t·(-2sin t) dt = -2∫₀^{2π} sin²t dt = -2·π = -2π，取绝对值得2π。或用对称性，实际椭圆面积 πab = π·2·1 = 2π。" }
            ]
        }
    };

    function compileExpression(expr) {
        const source = expr.trim()
            .replace(/π/g, 'pi')
            .replace(/θ/g, 'theta')
            .replace(/\bln\s*\(/g, 'log(')
            .replace(/\^/g, '**');
        if (!source) throw new Error('表达式不能为空');
        return new Function('x', `
            const {
                sin, cos, tan, asin, acos, atan, atan2,
                sinh, cosh, tanh, sqrt, cbrt, abs, log, log10,
                exp, pow, min, max, floor, ceil, round, PI, E
            } = Math;
            const pi = PI;
            const e = E;
            const theta = x;
            const t = x;
            return (${source});
        `);
    }

    function finiteValue(f, x) {
        const value = Number(f(x));
        if (!Number.isFinite(value)) throw new Error(`函数在 ${Number(x).toPrecision(6)} 处没有有效数值`);
        return value;
    }

    // 计算器同样使用“到旋转轴的距离”；当前轴偏移默认 0，便于未来扩展 y=c 或 x=c。
    function calcRadiusToAxis(value, axisOffset = 0) {
        return Math.abs(value - axisOffset);
    }

    function calcWasherRadii(firstValue, secondValue, axisOffset = 0) {
        const firstRadius = calcRadiusToAxis(firstValue, axisOffset);
        const secondRadius = calcRadiusToAxis(secondValue, axisOffset);
        return {
            outer: Math.max(firstRadius, secondRadius),
            inner: Math.min(firstRadius, secondRadius),
            swapped: secondRadius > firstRadius
        };
    }

    function derivative(f, x) {
        const step = Math.max(1e-5, Math.abs(x) * 1e-5);
        const yp = Number(f(x + step));
        const ym = Number(f(x - step));
        if (Number.isFinite(yp) && Number.isFinite(ym)) return (yp - ym) / (2 * step);
        const y0 = Number(f(x));
        if (Number.isFinite(yp) && Number.isFinite(y0)) return (yp - y0) / step;
        if (Number.isFinite(ym) && Number.isFinite(y0)) return (y0 - ym) / step;
        throw new Error(`无法在 ${Number(x).toPrecision(6)} 附近估计导数`);
    }

    function integrateSimpson(g, a, b, steps = 1000) {
        const n = steps % 2 === 0 ? steps : steps + 1;
        const h = (b - a) / n;
        let sum = finiteValue(g, a) + finiteValue(g, b);
        for (let i = 1; i < n; i++) {
            const x = a + i * h;
            sum += (i % 2 ? 4 : 2) * finiteValue(g, x);
        }
        return sum * h / 3;
    }

        const type = document.getElementById('calcType').value;

        const func2Str = document.getElementById('calcFunc2').value;
        const a = parseFloat(document.getElementById('calcA').value);
        const b = parseFloat(document.getElementById('calcB').value);
        if (isNaN(a) || isNaN(b) || a === b) { setCalcMessage('请输入有效且不相等的积分区间', true); return; }
        try {
            const f = compileExpression(funcStr);
            const g2 = compileExpression(func2Str || '0');
            let result, note = '';
            if (type === 'disk') {
                result = integrateSimpson(x => Math.PI * calcRadiusToAxis(finiteValue(f, x)) ** 2, a, b);
            } else if (type === 'washer') {
                let swappedRadii = false;
                result = integrateSimpson(x => {
                    const radii = calcWasherRadii(finiteValue(f, x), finiteValue(g2, x));
                    if (radii.swapped) swappedRadii = true;
                    return Math.PI * (radii.outer ** 2 - radii.inner ** 2);
                }, a, b);
                if (swappedRadii) note = '（提示：已按到旋转轴的距离自动识别外半径和内半径）';
            } else if (type === 'shell') {
                result = integrateSimpson(x => 2 * Math.PI * Math.abs(x) * Math.abs(finiteValue(f, x)), a, b);
            } else if (type === 'arclength') {
                result = integrateSimpson(x => Math.sqrt(1 + derivative(f, x) ** 2), a, b);
            } else if (type === 'surface') {
                result = integrateSimpson(x => 2 * Math.PI * calcRadiusToAxis(finiteValue(f, x)) * Math.sqrt(1 + derivative(f, x) ** 2), a, b);
            } else if (type === 'polarArea') {
                result = integrateSimpson(theta => 0.5 * finiteValue(f, theta) ** 2, a, b);
            }
            setCalcMessage(`结果 ≈ ${result.toFixed(6)} ${note}`.trim());
        } catch (e) { setCalcMessage(`计算失败：${e.message || '请检查表达式语法'}`, true); }
    };
</script>
