<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math OBS | AP Calculus 3D Integral Lab</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --bg: #0B1320;
            --card-bg: #F5F0E1;
            --text: #1E293B;
            --accent: #145DA0;
            --bc: #C9A227;
            --border: #D7CCB6;
            --shadow: 0 8px 26px rgba(11,19,32,0.16);
            --radius: 16px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(180deg, #0B1320 0%, #111C2E 100%);
            font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
            color: var(--text);
            height: 100vh;
            display: block;
            overflow: hidden;
        }
        .app-shell {
            display: grid;
            grid-template-columns: 288px minmax(0, 1fr);
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #0B1320 0%, #111C2E 100%);
        }
        .sidebar {
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #0B1320;
            border-right: 1px solid rgba(201,162,39,0.36);
            color: #F8FAFC;
            box-shadow: 10px 0 28px rgba(11,19,32,0.32);
            z-index: 20;
        }
        .sidebar-brand {
            display: grid;
            grid-template-columns: 112px minmax(0, 1fr);
            align-items: center;
            gap: 12px;
            min-height: 148px;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(215,204,182,0.2);
        }
        .brand-mark {
            display: block;
            width: 108px;
            height: 126px;
            border-radius: 10px;
            background: rgba(201,162,39,0.18);
            border: 1px solid rgba(201,162,39,0.42);
            object-fit: contain;
            object-position: center;
            padding: 2px;
            box-shadow: 0 10px 22px rgba(0,0,0,0.28);
        }
        .brand-copy strong {
            display: block;
            color: #C9A227;
            font-size: 0.86rem;
            line-height: 1.25;
            text-transform: uppercase;
        }
        .brand-copy span {
            display: block;
            margin-top: 4px;
            color: #D7CCB6;
            font-size: 0.7rem;
            letter-spacing: 0;
            text-transform: uppercase;
        }
        .workspace {
            min-width: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            text-align: left;
            padding: 14px 28px;
            background: #0B1320;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(215,204,182,0.24);
            flex-shrink: 0;
            box-shadow: 0 2px 16px rgba(11,19,32,0.28);
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #F8FAFC, #C9A227);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-title p {
            margin-top: 4px;
            color: #D7CCB6;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .fake-icon-button {
            width: 38px;
            height: 38px;
            padding: 0;
            margin: 0;
            display: grid;
            place-items: center;
            border-radius: 8px;
            border: 1px solid rgba(201,162,39,0.34);
            background: rgba(245,240,225,0.08);
            color: #C9A227;
            font-size: 1rem;
            font-weight: 900;
        }
        .user-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 42px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(201,162,39,0.34);
            background: rgba(245,240,225,0.08);
            color: #F8FAFC;
        }
        .user-avatar {
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #C9A227;
            color: #0B1320;
            font-size: 0.76rem;
            font-weight: 900;
        }
        .user-chip strong,
        .user-chip small {
            display: block;
            line-height: 1.2;
        }
        .user-chip strong { font-size: 0.86rem; }
        .user-chip small { color: #D7CCB6; font-size: 0.68rem; }
        .nav {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 6px;
            flex-wrap: nowrap;
            padding: 18px 16px;
            background: transparent;
            backdrop-filter: none;
            border-bottom: 0;
            flex-shrink: 0;
            z-index: 10;
            box-shadow: none;
        }
        .nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            background: rgba(245,240,225,0.08);
            color: #D7CCB6;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: 0.3s;
            white-space: nowrap;
            border: 1px solid rgba(215,204,182,0.18);
            cursor: pointer;
        }
        .nav a::before {
            width: 22px;
            color: #C9A227;
            font-weight: 900;
            text-align: center;
        }
        .nav a[data-page="home"]::before { content: "⌂"; }
        .nav a[data-page="learn"]::before { content: "□"; }
        .nav a[data-page="visualLab"]::before { content: "⌁"; }
        .nav a[data-page="practice"]::before { content: "✎"; }
        .nav a[data-page="formulaMap"]::before { content: "∑"; }
        .nav a[data-page="mistakes"]::before { content: "!"; }
        .nav a:hover, .nav a.active {
            background: var(--accent);
            color: #F8FAFC;
            border-color: var(--accent);
            box-shadow: 0 2px 10px rgba(20,93,160,0.25);
        }
        .nav a.bc-link { background: rgba(201,162,39,0.16); color: #F5F0E1; }
        .nav a.bc-link:hover, .nav a.bc-link.active {
            background: var(--bc);
            color: #0B1320;
            border-color: var(--bc);
            box-shadow: 0 2px 10px rgba(201,162,39,0.24);
        }
        .sidebar-tools {
            margin-top: auto;
            padding: 16px;
            border-top: 1px solid rgba(215,204,182,0.18);
        }
        .sidebar-tools button {
            width: 100%;
            min-height: 40px;
            margin: 0 0 8px;
            border-radius: 8px;
            border: 1px solid rgba(215,204,182,0.24);
            background: rgba(245,240,225,0.08);
            color: #D7CCB6;
            text-align: left;
            font-weight: 800;
        }
        .sidebar-tools button.primary {
            background: #C9A227;
            border-color: #C9A227;
            color: #0B1320;
        }
        .observatory-status {
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(201,162,39,0.34);
            background: rgba(17,28,46,0.9);
            color: #D7CCB6;
        }
        .observatory-status span {
            display: block;
            margin-bottom: 6px;
            color: #C9A227;
            font-size: 0.68rem;
            font-weight: 900;
            text-transform: uppercase;
        }
        .observatory-status strong {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #F8FAFC;
            font-size: 0.78rem;
            line-height: 1.35;
        }
        .observatory-status strong::before {
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #2CB1BC;
        }
        .main-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .card {
            position: absolute;
            inset: 0;
            display: none;
            overflow-y: auto;
            padding: 24px;
            background: transparent;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .card.active {
            display: block;
            visibility: visible;
            opacity: 1;
        }
        .card-inner {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 24px;
            color: #1E293B;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #F8FAFC;
        }
        .badge.ab { background: linear-gradient(135deg, #145DA0, #2CB1BC); }
        .badge.bc { background: linear-gradient(135deg, #C9A227, #D7CCB6); color: #0B1320; }
        .badge.ext { background: linear-gradient(135deg, #0B3D6E, #C9A227); }
        .formula {
            background: #FFF9EA;
            padding: 14px 18px;
            border-radius: 10px;
            margin: 14px 0;
            border: 1px solid var(--border);
            font-size: 1.05rem;
            overflow-x: auto;
            color: #1E293B;
        }
        .video-wrap {
            margin: 15px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            aspect-ratio: 16 / 9;
            box-shadow: 0 2px 8px rgba(11,19,32,0.1);
            background: #0B1320;
        }
        .video-wrap iframe,
        .video-wrap video { width: 100%; height: 100%; border: 0; display: block; }
        .video-tools {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: -4px 0 14px;
            color: #475569;
            font-size: 0.85rem;
        }
        .video-tools a {
            display: inline-flex;
            align-items: center;
            padding: 7px 12px;
            border-radius: 20px;
            background: rgba(20,93,160,0.12);
            color: #0B3D6E;
            text-decoration: none;
            font-weight: 700;
            border: 1px solid rgba(20,93,160,0.24);
        }
        .video-tools a:hover { background: rgba(20,93,160,0.18); }
        .video-note {
            flex-basis: 100%;
            color: #475569;
            line-height: 1.5;
        }
        .model-block {
            margin: 16px 0 18px;
        }
        .model-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            color: #1E293B;
            font-weight: 800;
        }
        .compat-toggle {
            margin: 0;
            padding: 6px 12px;
            border-radius: 18px;
            font-size: 0.78rem;
            background: #FFF9EA;
            color: #475569;
        }
        .canvas-container {
            width: 100%;
            height: 380px;
            border: 2px solid #D7CCB6;
            border-radius: 12px;
            margin: 0;
            background: #FFF9EA;
            cursor: grab;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(11,19,32,0.04);
        }
        .compat-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .compat-status {
            position: absolute;
            top: 10px;
            left: 12px;
            z-index: 10;
            max-width: calc(100% - 24px);
            padding: 6px 10px;
            border-radius: 10px;
            background: rgba(255,249,234,0.94);
            color: #475569;
            font-size: 0.8rem;
            line-height: 1.45;
            pointer-events: none;
            box-shadow: 0 1px 8px rgba(11,19,32,0.12);
        }
        .canvas-container:active { cursor: grabbing; }
        .hint {
            position: absolute;
            bottom: 10px;
            left: 14px;
            color: #475569;
            font-size: 0.8rem;
            background: rgba(255,249,234,0.92);
            padding: 4px 10px;
            border-radius: 12px;
            z-index: 10;
        }
        button {
            padding: 9px 18px;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #D7CCB6;
            background: #FFF9EA;
            color: #475569;
            margin: 4px;
        }
        button.accent {
            background: var(--accent);
            color: #F8FAFC;
            border-color: var(--accent);
        }
        button.accent:hover {
            background: #0B3D6E;
            box-shadow: 0 2px 8px rgba(20,93,160,0.18);
        }
        button.bc-btn {
            background: var(--bc);
            color: #0B1320;
            border-color: var(--bc);
        }
        button.bc-btn:hover {
            background: #D7CCB6;
            box-shadow: 0 2px 8px rgba(201,162,39,0.2);
        }
        input[type="range"] { width: 150px; accent-color: var(--accent); }
        input[type="text"], input[type="number"], select {
            padding: 10px 14px;
            background: #FFF9EA;
            border: 2px solid #D7CCB6;
            border-radius: 8px;
            color: #1E293B;
            margin: 0 4px;
        }
        .result {
            margin-top: 10px;
            padding: 10px 16px;
            background: #FFF9EA;
            border-radius: 8px;
            color: #0B3D6E;
            font-weight: 700;
        }
        .quiz { margin-top: 20px; }
        .quiz h3 { color: #C9A227; margin-bottom: 8px; }
        .quiz button.ans-btn {
            padding: 4px 12px;
            font-size: 0.85rem;
            background: rgba(201,162,39,0.16);
            border: 1px solid rgba(201,162,39,0.36);
            color: #0B1320;
            margin-top: 4px;
        }
        .quiz button.ans-btn:hover { background: rgba(201,162,39,0.26); }
        .quiz .explanation {
            display: none;
            margin-top: 6px;
            padding: 8px 12px;
            background: #FFF9EA;
            border-left: 4px solid #2CB1BC;
            color: #1E293B;
            border-radius: 4px;
        }
        .tip {
            background: #FFF9EA;
            border-left: 4px solid #C9A227;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            color: #1E293B;
        }
        .explanation-section {
            background: #FFF9EA;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin: 12px 0;
        }
        .explanation-section h3 { color: #0B3D6E; margin-bottom: 8px; }
        .explanation-section p { color: #1E293B; margin-bottom: 6px; }
        .explanation-section ul { margin-left: 20px; color: #475569; }
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
            margin: 12px 0;
        }
        .lesson-card,
        .mistake-card,
        .practice-card {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #FFF9EA;
        }
        .exam-bank-intro {
            display: grid;
            gap: 8px;
            margin-bottom: 16px;
        }
        .exam-filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0 18px;
        }
        .exam-filter-btn {
            width: auto;
            margin: 0;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(20,93,160,0.22);
            background: rgba(20,93,160,0.08);
            color: #0B3D6E;
            font-size: 0.78rem;
            font-weight: 900;
        }
        .exam-filter-btn.active {
            background: #0B3D6E;
            color: #F8FAFC;
            border-color: #0B3D6E;
            box-shadow: 0 8px 16px rgba(11,61,110,0.18);
        }
        .exam-module {
            margin: 20px 0 28px;
        }
        .exam-module[hidden],
        .exam-answer-panel[hidden] {
            display: none;
        }
        .exam-module-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(215,204,182,0.8);
            padding-bottom: 8px;
        }
        .exam-module-header h3 {
            margin: 0;
            color: #0B3D6E;
        }
        .exam-count {
            font-size: 0.76rem;
            font-weight: 900;
            color: #0B1320;
            background: rgba(201,162,39,0.2);
            border: 1px solid rgba(201,162,39,0.38);
            border-radius: 999px;
            padding: 4px 10px;
            white-space: nowrap;
        }
        .exam-card {
            display: grid;
            grid-template-columns: minmax(280px, 0.9fr) minmax(280px, 1.1fr);
            gap: 14px;
            margin: 12px 0;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #FFF9EA;
            box-shadow: 0 8px 18px rgba(11,19,32,0.08);
        }
        .exam-card-media {
            display: grid;
            gap: 8px;
            align-content: start;
        }
        .exam-shot {
            border-radius: 8px;
            border: 1px solid rgba(215,204,182,0.9);
            background: #fff;
            padding: 8px;
            overflow: hidden;
        }
        .exam-shot img {
            display: block;
            width: 100%;
            height: auto;
        }
        .exam-shot figcaption {
            margin-top: 6px;
            color: #64748B;
            font-size: 0.76rem;
            font-weight: 800;
        }
        .exam-card-body {
            display: grid;
            gap: 10px;
            align-content: start;
        }
        .exam-card-topline {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .exam-ref {
            color: #0B3D6E;
            font-weight: 900;
            font-size: 1rem;
        }
        .exam-pill {
            border-radius: 999px;
            padding: 3px 8px;
            font-size: 0.72rem;
            font-weight: 900;
            background: rgba(20,93,160,0.12);
            color: #0B3D6E;
            border: 1px solid rgba(20,93,160,0.22);
        }
        .exam-pill.frq {
            background: rgba(201,162,39,0.16);
            color: #0B1320;
            border-color: rgba(201,162,39,0.42);
        }
        .exam-answer {
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(20,93,160,0.08);
            border: 1px solid rgba(20,93,160,0.18);
            color: #1E293B;
            font-weight: 800;
        }
        .exam-reveal-btn {
            justify-self: start;
            width: auto;
            margin: 4px 0 0;
            padding: 9px 13px;
            border-radius: 999px;
        }
        .exam-answer-panel {
            display: grid;
            gap: 10px;
            margin-top: 2px;
        }
        .exam-study-note {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(201,162,39,0.32);
            background: rgba(201,162,39,0.1);
        }
        .exam-card-body h4 {
            margin: 0 0 4px;
            color: #0B3D6E;
        }
        .exam-card-body ul {
            margin-left: 18px;
            color: #475569;
            line-height: 1.6;
        }
        .exam-traps {
            padding: 10px 12px;
            border-left: 4px solid #A23E48;
            border-radius: 8px;
            background: rgba(162,62,72,0.08);
        }
        .lesson-card h4,
        .mistake-card h4,
        .practice-card h4 {
            margin-bottom: 8px;
            color: #0B3D6E;
        }
        .lesson-card p,
        .practice-card p { margin-bottom: 6px; }
        .lesson-card ul,
        .mistake-card ul,
        .practice-card ul { margin-left: 18px; }
        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
        }
        .topic-tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 9px;
            border-radius: 999px;
            border: 1px solid rgba(20,93,160,0.24);
            background: rgba(20,93,160,0.12);
            color: #0B3D6E;
            font-size: 0.75rem;
            font-weight: 800;
        }
        .topic-tag.ext { border-color: rgba(201,162,39,0.42); background: rgba(201,162,39,0.14); color: #0B1320; }
        .topic-tag.warn { border-color: rgba(162,62,72,0.3); background: rgba(162,62,72,0.1); color: #A23E48; }
        .method-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            overflow: hidden;
            border-radius: 10px;
        }
        .method-table th,
        .method-table td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }
        .method-table th {
            background: rgba(20, 93, 160, 0.12);
            color: #0B3D6E;
        }
        details.lesson-accordion {
            margin: 10px 0;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #FFF9EA;
            overflow: hidden;
        }
        details.lesson-accordion summary {
            cursor: pointer;
            padding: 12px 14px;
            font-weight: 800;
            color: #0B3D6E;
        }
        details.lesson-accordion > div {
            padding: 0 14px 14px;
        }
        .btn-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0 16px;
        }
        .site-hero {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
            gap: 22px;
            align-items: stretch;
            margin-bottom: 24px;
        }
        .hero-copy,
        .preview-card,
        .path-card,
        .tool-card,
        .lesson-shell,
        .page-intro {

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const sceneData = {};
    const compatScenes = {};

    function createCompatScene(containerId, reason = 'Compatibility mode') {
        const container = document.getElementById(containerId);
        if (!container) return null;
        const key = containerId.replace(/Canvas$/, '');
        container.innerHTML = '';

        const canvas = document.createElement('canvas');
        canvas.className = 'compat-canvas';
        const status = document.createElement('div');
        status.className = 'compat-status';
        status.textContent = `${reason}: drag to rotate, scroll to zoom`;
        container.appendChild(canvas);
        container.appendChild(status);

        const ctx = canvas.getContext('2d');
        const state = { rx: -0.65, ry: 0.75, zoom: 1, dragging: false, px: 0, py: 0 };
        const colors = {
            blue: '#2563eb',
            red: '#dc2626',
            gold: '#f59e0b',
            purple: '#7c3aed',
            green: '#10b981',
            cyan: '#0891b2',
            grid: '#dbe4ee',
            axisX: '#ef4444',
            axisY: '#16a34a',
            axisZ: '#2563eb'
        };

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const rect = container.getBoundingClientRect();
            canvas.width = Math.max(1, Math.floor(rect.width * dpr));
            canvas.height = Math.max(1, Math.floor(rect.height * dpr));
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            draw();
        }

        function project(x, y, z) {
            const cy = Math.cos(state.ry), sy = Math.sin(state.ry);
            const cx = Math.cos(state.rx), sx = Math.sin(state.rx);
            const x1 = x * cy - z * sy;
            const z1 = x * sy + z * cy;
            const y1 = y * cx - z1 * sx;
            const z2 = y * sx + z1 * cx;
            const rect = container.getBoundingClientRect();
            const scale = Math.min(rect.width, rect.height) * 0.16 * state.zoom;
            return {
                x: rect.width / 2 + x1 * scale,
                y: rect.height / 2 - y1 * scale,
                z: z2
            };
        }

        function path(points) {
            ctx.beginPath();
            points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        }

        function strokeLine(points, color, width = 2) {
            path(points.map(p => project(...p)));
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.stroke();
        }

        function fillPoly(points, color, alpha = 0.35, stroke = null) {
            const projected = points.map(p => project(...p));
            path(projected);
            ctx.closePath();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.fill();
            ctx.globalAlpha = 1;
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }

        function circlePoints(center, radius, plane = 'yz', count = 48) {
            const pts = [];
            for (let i = 0; i <= count; i++) {
                const a = i / count * Math.PI * 2;
                if (plane === 'yz') pts.push([center[0], center[1] + radius * Math.cos(a), center[2] + radius * Math.sin(a)]);
                if (plane === 'xz') pts.push([center[0] + radius * Math.cos(a), center[1], center[2] + radius * Math.sin(a)]);
                if (plane === 'xy') pts.push([center[0] + radius * Math.cos(a), center[1] + radius * Math.sin(a), center[2]]);
            }
            return pts;
        }

        function drawDisc(center, radius, color, alpha = 0.35) {
            fillPoly(circlePoints(center, radius, 'yz', 60), color, alpha, color);
        }

        function drawGridAndAxes() {
            for (let i = -4; i <= 4; i++) {
                strokeLine([[-4, 0, i], [4, 0, i]], colors.grid, 1);
                strokeLine([[i, 0, -4], [i, 0, 4]], colors.grid, 1);
            }
            strokeLine([[-4.2, 0, 0], [4.2, 0, 0]], colors.axisX, 2);
            strokeLine([[0, -2.2, 0], [0, 3.8, 0]], colors.axisY, 2);

        function drawAreaModel() {
            const top = [], bottom = [];
            for (let i = 0; i <= 50; i++) {
                const t = i / 50;
                top.push([t * 3 - 1.5, t * 2.4 - 1.1, 0]);
                bottom.push([t * 3 - 1.5, t * t * 2.4 - 1.1, 0]);
            }
            fillPoly([...top, ...bottom.reverse()], colors.gold, 0.35, '#d97706');
            strokeLine(top, colors.blue, 3);
            strokeLine(bottom.reverse(), colors.red, 3);
            for (let i = 4; i <= 44; i += 7) {

                const x = t * 3 - 1.5, y1 = t * t * 2.4 - 1.1, y2 = t * 2.4 - 1.1;
                fillPoly([[x - 0.08, y1, 0.08], [x + 0.08, y1, 0.08], [x + 0.08, y2, 0.08], [x - 0.08, y2, 0.08]], colors.red, 0.5);
            }

        function drawDiskModel() {
            for (let i = 0; i < 10; i++) {
                const x = -1.8 + i * 0.36;

        function drawWasherModel() {

        function drawCrossModel() {

            const edges = [

                [[x0,y0,z0],[x0,y1,z0]], [[x1,y0,z0],[x1,y1,z0]], [[x0,y0,z1],[x0,y1,z1]], [[x1,y0,z1],[x1,y1,z1]],

    function createScene(containerId) {
        const container = document.getElementById(containerId);

        const h = container.clientHeight || 380;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f7fa);
        const cam = new THREE.PerspectiveCamera(50, w / h, 0.1, 100);
        cam.position.set(5, 4, 6);
        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ antialias: true });
        } catch (error) {
            createCompatScene(containerId, 'This browser could not create WebGL, so the compatibility model is enabled');
            return null;
        }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(w, h);
        renderer.domElement.style.display = 'block';
        container.appendChild(renderer.domElement);
        const controls = new OrbitControls(cam, renderer.domElement);
        controls.enableDamping = true;
        scene.add(new THREE.AmbientLight(0x8090b0, 0.8));
        const dir = new THREE.DirectionalLight(0xffffff, 1.0);
        dir.position.set(5, 8, 5);

        const dir2 = new THREE.DirectionalLight(0xaaccff, 0.4);
        dir2.position.set(-3, 2, -2);

        const grid = new THREE.GridHelper(8, 20, 0xccd5e0, 0xe8ecf1);
        scene.add(grid);
        const axes = new THREE.AxesHelper(4);
        scene.add(axes);

        let stopped = false;
        const animate = () => {
            if (stopped) return;
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, cam);
        };
        animate();
        return {
            scene, cam, renderer, controls, container, extra: {},
            stop() {
                stopped = true;
                controls.dispose();
                renderer.dispose();
            }
        };
    }
