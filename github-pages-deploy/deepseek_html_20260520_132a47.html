    const LAB_VISUAL_LIMIT = 8;
    const POLAR_VISUAL_LIMIT = 4.5;

    function parseLabFunction(expr) {
        const source = expr.trim().replace(/\^/g, '**').replace(/π/g, 'pi');
        try {
            const fn = new Function('t', `
                const {
                    sin, cos, tan, asin, acos, atan, sqrt, cbrt, abs, log, log10,
                    exp, pow, min, max, floor, ceil, round, PI, E
                } = Math;
                const pi = PI;
                const x = t;
                const y = t;
                const theta = t;
                return (${source});
            `);
            const test = Number(fn(1));
            if (!Number.isFinite(test)) throw new Error('invalid value');
            return fn;
        } catch (error) {
            return null;
        }
    }

    function validateLabFunctionOnInterval(fn, a, b, samples = 360) {
        const checkpoints = new Set([0, samples]);
        for (let i = 0; i <= samples; i++) checkpoints.add(i);
        for (const i of checkpoints) {
            const t = a + (i / samples) * (b - a);
            const value = Number(fn(t));
            if (!Number.isFinite(value)) {
                return `The function has no valid value near t=${formatLabLimit(t)}. Split the interval or edit the bounds.`;
            }
        }
        return '';
    }

    function modeVisualLimit(mode = advancedLab.mode) {
        return mode === 'polar' ? POLAR_VISUAL_LIMIT : LAB_VISUAL_LIMIT;
    }

    function integrateLabTrapezoid(func, a, b, n = 240) {
        const h = (b - a) / n;
        let sum = 0.5 * (func(a) + func(b));
        for (let i = 1; i < n; i++) sum += func(a + i * h);
        return sum * h;
    }

    function labRawValue(func, t, fallback = 0) {
        const value = Number(func(t));
        return Number.isFinite(value) ? value : fallback;
    }

    function labValue(func, t, min = -12, max = 12) {
        return THREE.MathUtils.clamp(labRawValue(func, t), min, max);
    }

    function labVisualValue(func, t, limit = modeVisualLimit()) {
        return labValue(func, t, -limit, limit);
    }

    function labHasVisualClipping(limit = modeVisualLimit(), samples = 120) {
        const lab = advancedLab;
        const funcs = lab.mode === 'disk' || lab.mode === 'arc' ? [lab.f] : [lab.f, lab.g];
        for (let i = 0; i <= samples; i++) {
            const t = lab.tMin + (i / samples) * (lab.tMax - lab.tMin);
            for (const fn of funcs) {
                const value = Number(fn(t));
                if (Number.isFinite(value) && Math.abs(value) > limit) return true;
            }
        }
        return false;
    }

    // Mathematical radius: distance from the point to the axis of rotation, not the raw function value.
    function getRadiusToAxis(value, axisOffset = 0) {
        return Math.abs(value - axisOffset);
    }

    function getLabAxisOffset(lab = advancedLab) {
        return Number.isFinite(lab.axisOffset) ? lab.axisOffset : 0;
    }

    // Washer radii are sorted by distance to the axis so top/bottom position does not mislead radius order.
    function getWasherRadii(firstValue, secondValue, axisOffset = 0) {
        const firstRadius = getRadiusToAxis(firstValue, axisOffset);
        const secondRadius = getRadiusToAxis(secondValue, axisOffset);
        return {
            outer: Math.max(firstRadius, secondRadius),
            inner: Math.min(firstRadius, secondRadius),
            swapped: secondRadius > firstRadius
        };
    }

    function getBoundedRadius(func, t, max = 8, axisOffset = getLabAxisOffset()) {
        return THREE.MathUtils.clamp(getRadiusToAxis(labValue(func, t, -max, max), axisOffset), 0, max);
    }

    // Sample sign changes to warn about splitting; this does not replace exact intersection solving.
    function hasSignChange(func, a, b, samples = 80, epsilon = 1e-7) {
        let lastSign = 0;
        for (let i = 0; i <= samples; i++) {
            const t = a + (i / samples) * (b - a);
            const value = Number(func(t));
            if (!Number.isFinite(value) || Math.abs(value) <= epsilon) continue;
            const sign = Math.sign(value);
            if (lastSign && sign !== lastSign) return true;
            lastSign = sign;
        }
        return false;
    }

    function areaDifferenceChangesSign() {
        const lab = advancedLab;
        return hasSignChange(t => labRawValue(lab.f, t) - labRawValue(lab.g, t), lab.tMin, lab.tMax);
    }

    // Polar area density: signed r is squared directly; two polar curves can provide outer and inner radii.
    function polarAreaDensity(outerRadius, innerRadius = 0) {
        return 0.5 * (outerRadius * outerRadius - innerRadius * innerRadius);
    }

    function labDerivative(func, t) {
        const lab = advancedLab;
        const span = Math.max(1e-4, Math.abs(lab.tMax - lab.tMin) * 1e-4);
        const left = Math.max(lab.tMin, t - span);
        const right = Math.min(lab.tMax, t + span);
        if (right <= left) return 0;
        return (labVisualValue(func, right) - labVisualValue(func, left)) / (right - left);
    }

    function formatLabLimit(value) {
        if (Math.abs(value) < 1e-9) return '0';
        if (Math.abs(value - Math.PI) < 1e-6) return 'π';
        if (Math.abs(value - TAU) < 1e-6) return '2π';
        return Number(value).toFixed(value % 1 === 0 ? 0 : 2);
    }

    function formatLabInterval() {
        return `[${formatLabLimit(advancedLab.tMin)},${formatLabLimit(advancedLab.tMax)}]`;
    }

    function toSubscriptText(value) {
        const map = { '0':'₀', '1':'₁', '2':'₂', '3':'₃', '4':'₄', '5':'₅', '6':'₆', '7':'₇', '8':'₈', '9':'₉', '-':'₋', '+':'₊', '(':'₍', ')':'₎' };
        return String(value).replace(/[0-9+\-()]/g, char => map[char] || char);
    }

    function toSuperscriptText(value) {
        const map = { '0':'⁰', '1':'¹', '2':'²', '3':'³', '4':'⁴', '5':'⁵', '6':'⁶', '7':'⁷', '8':'⁸', '9':'⁹', '-':'⁻', '+':'⁺', '(':'⁽', ')':'⁾' };
        return String(value).replace(/[0-9+\-()]/g, char => map[char] || char);
    }

    function formatLabBounds() {
        return `${toSubscriptText(formatLabLimit(advancedLab.tMin))}${toSuperscriptText(formatLabLimit(advancedLab.tMax))}`;
    }

    function computeLabMetric() {
        const lab = advancedLab;
        const axisOffset = getLabAxisOffset(lab);
        if (lab.mode === 'area') {
            return integrateLabTrapezoid(t => Math.abs(labVisualValue(lab.f, t) - labVisualValue(lab.g, t)), lab.tMin, lab.tMax, 320);
        }
        if (lab.mode === 'disk') {
            return Math.PI * integrateLabTrapezoid(t => getRadiusToAxis(labVisualValue(lab.f, t), axisOffset) ** 2, lab.tMin, lab.tMax, 260);
        }
        if (lab.mode === 'washer') {
            return Math.PI * integrateLabTrapezoid(t => {
                const { outer, inner } = getWasherRadii(labVisualValue(lab.f, t), labVisualValue(lab.g, t), axisOffset);
                return outer * outer - inner * inner;
            }, lab.tMin, lab.tMax, 260);
        }
        if (lab.mode === 'polar') {
            return integrateLabTrapezoid(t => {
                const first = Math.abs(labVisualValue(lab.f, t, POLAR_VISUAL_LIMIT));
                const second = Math.abs(labVisualValue(lab.g, t, POLAR_VISUAL_LIMIT));
                return polarAreaDensity(Math.max(first, second), Math.min(first, second));
            }, lab.tMin, lab.tMax, 320);
        }
        if (lab.mode === 'arc') {
            return integrateLabTrapezoid(t => Math.sqrt(1 + labDerivative(lab.f, t) ** 2), lab.tMin, lab.tMax, 320);
        }
        return integrateLabTrapezoid(t => {
            const base = Math.max(0, Math.abs(labVisualValue(lab.f, t) - labVisualValue(lab.g, t)));
            return base * base;
        }, lab.tMin, lab.tMax, 240);
    }

    function washerRadiiSwapDetected(samples = 80) {
        const lab = advancedLab;
        const axisOffset = getLabAxisOffset(lab);
        for (let i = 0; i <= samples; i++) {
            const t = lab.tMin + (i / samples) * (lab.tMax - lab.tMin);
            if (getWasherRadii(labVisualValue(lab.f, t), labVisualValue(lab.g, t), axisOffset).swapped) return true;
        }
        return false;
    }

    function getLabWarnings() {
        const lab = advancedLab;
        const warnings = [];
        if (labHasVisualClipping()) {
            warnings.push(`Function values exceed the 3D visual range ±${modeVisualLimit()}. The model and reading use clipped visual values to stay consistent.`);
        }
        if (lab.mode === 'area' && areaDifferenceChangesSign()) {
            warnings.push('The two curves may intersect inside the interval. The system uses ∫|f-g| for area.');
        }
        if (lab.mode === 'area' && lab.axis === 'y') {
            warnings.push('This is a horizontal visual scan, not a strict dy area integral. A true dy setup requires x=right(y) and x=left(y).');
        }
        if (lab.mode === 'washer' && washerRadiiSwapDetected()) {
            warnings.push('The distance order to the axis may switch. The system identifies outer and inner radius by distance.');
        }
        if (lab.mode === 'polar') {
            warnings.push('Polar reading uses two radii: g(θ)=0 gives single-curve area; otherwise it uses outer²-inner².');
        }
        return warnings;
    }

    function updateLabInfoUI() {
        const lab = advancedLab;
        const volumeEl = labEl('VolumeValue');
        const metricEl = labEl('MetricLabel');
        const unitEl = labEl('UnitLabel');
        const modeEl = labEl('ModeName');
        const axisEl = labEl('AxisName');
        const formulaEl = labEl('FormulaTxt');
        const warningEl = labEl('WarningMsg');
        if (!volumeEl || !modeEl || !axisEl || !formulaEl) return;

        const meta = labModeMeta[lab.mode] || labModeMeta.area;
        const variable = lab.axis === 'x' ? 'x' : 'y';
        const metric = computeLabMetric();
        modeEl.textContent = meta.name;
        axisEl.textContent = meta.axis ? (lab.axis === 'x' ? meta.axisX : meta.axisY) : 'No rotation axis';
        formulaEl.textContent = meta.formula(variable)
            .replace('[a,b]', formatLabBounds())
            .replace('[α,β]', formatLabBounds());
        volumeEl.textContent = metric.toFixed(3);
        if (metricEl) metricEl.textContent = meta.metric;
        if (unitEl) unitEl.textContent = meta.unit;
        if (warningEl) {
            const warnings = getLabWarnings();
            warningEl.textContent = warnings.join(' ');
            warningEl.style.display = warnings.length ? 'block' : 'none';
        }
    }

    function disposeLabObject(object) {
        object.traverse?.(child => {
            child.geometry?.dispose?.();
            if (Array.isArray(child.material)) child.material.forEach(mat => mat.dispose?.());
            else child.material?.dispose?.();
        });
    }

    function clearLabGroup(group) {
        while (group.children.length) {
            const child = group.children.pop();
            disposeLabObject(child);
        }
    }

    function addLabEdges(mesh, color = 0xffffff) {
        const edgesGeo = new THREE.EdgesGeometry(mesh.geometry);
        const edgesMat = new THREE.LineBasicMaterial({ color });
        mesh.add(new THREE.LineSegments(edgesGeo, edgesMat));
        return mesh;
    }

    // Washer geometry: extrude an annular cross section along thickness to create a real hollow washer.
    function createLabHollowCylinder(outerRadius, innerRadius, height, radialSegments = 56, heightSegments = 1) {
        const outerR = Math.max(0.001, outerRadius);
        const innerR = THREE.MathUtils.clamp(innerRadius, 0.001, outerR - 0.001);
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        const indices = [];
        const ringSize = radialSegments + 1;

        for (let yIndex = 0; yIndex <= heightSegments; yIndex++) {
            const y = -height / 2 + (yIndex / heightSegments) * height;
            for (let i = 0; i <= radialSegments; i++) {
                const theta = (i / radialSegments) * TAU;
                vertices.push(outerR * Math.cos(theta), y, outerR * Math.sin(theta));
            }
        }

        const innerOffset = vertices.length / 3;
        for (let yIndex = 0; yIndex <= heightSegments; yIndex++) {
            const y = -height / 2 + (yIndex / heightSegments) * height;
            for (let i = 0; i <= radialSegments; i++) {
                const theta = (i / radialSegments) * TAU;
                vertices.push(innerR * Math.cos(theta), y, innerR * Math.sin(theta));
            }
        }

        for (let yIndex = 0; yIndex < heightSegments; yIndex++) {
            for (let i = 0; i < radialSegments; i++) {
                const a = yIndex * ringSize + i;
                const b = a + 1;
                const c = (yIndex + 1) * ringSize + i;
                const d = c + 1;
                indices.push(a, b, c, b, d, c);

                const ia = innerOffset + yIndex * ringSize + i;
                const ib = ia + 1;
                const ic = innerOffset + (yIndex + 1) * ringSize + i;
                const id = ic + 1;
                indices.push(ia, ic, ib, ib, ic, id);
            }
        }

        const topOuter = heightSegments * ringSize;
        const topInner = innerOffset + heightSegments * ringSize;
        const bottomOuter = 0;
        const bottomInner = innerOffset;
        for (let i = 0; i < radialSegments; i++) {
            const topOuterA = topOuter + i;
            const topOuterB = topOuterA + 1;
            const topInnerA = topInner + i;
            const topInnerB = topInnerA + 1;
            indices.push(topOuterA, topOuterB, topInnerA, topOuterB, topInnerB, topInnerA);

            const bottomOuterA = bottomOuter + i;
            const bottomOuterB = bottomOuterA + 1;
            const bottomInnerA = bottomInner + i;
            const bottomInnerB = bottomInnerA + 1;
            indices.push(bottomOuterA, bottomInnerA, bottomOuterB, bottomOuterB, bottomInnerA, bottomInnerB);
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
    }

    function makeLabFanMesh(points, material) {
        if (points.length < 3) return null;
        const vertices = [];
        const indices = [];
        points.forEach(point => vertices.push(point.x, point.y, point.z));
        for (let i = 1; i < points.length - 1; i++) indices.push(0, i, i + 1);
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return new THREE.Mesh(geometry, material);
    }

    function makeLabShapeMesh(points, color, opacity = 0.28) {
        if (points.length < 3) return null;
        const shape = new THREE.Shape();
        shape.moveTo(points[0].x, points[0].y);
        points.slice(1).forEach(point => shape.lineTo(point.x, point.y));
        shape.closePath();
        return new THREE.Mesh(
            new THREE.ShapeGeometry(shape),
            new THREE.MeshStandardMaterial({
                color,
                side: THREE.DoubleSide,
                transparent: true,
                opacity,
                roughness: 0.42
            })
        );
    }

    function makePolarBandMesh(start, end, outerInnerAtTheta, material, steps = 8) {
        const vertices = [];
        const indices = [];
        for (let i = 0; i < steps; i++) {
            const thetaA = start + (i / steps) * (end - start);
            const thetaB = start + ((i + 1) / steps) * (end - start);
            const a = outerInnerAtTheta(thetaA);
            const b = outerInnerAtTheta(thetaB);
            const base = vertices.length / 3;
            vertices.push(
                a.outer * Math.cos(thetaA), 0.02, a.outer * Math.sin(thetaA),
                b.outer * Math.cos(thetaB), 0.02, b.outer * Math.sin(thetaB),
                a.inner * Math.cos(thetaA), 0.02, a.inner * Math.sin(thetaA),
                b.inner * Math.cos(thetaB), 0.02, b.inner * Math.sin(thetaB)
            );
            indices.push(base, base + 1, base + 2, base + 1, base + 3, base + 2);
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return new THREE.Mesh(geometry, material);
    }

    function makeRevolutionGeometry(radiusFunc, a, b, axis = 'x', tSegments = 92, radialSegments = 48, axisOffset = 0) {
        const vertices = [];
        const indices = [];
        for (let i = 0; i <= tSegments; i++) {
            const t = a + (i / tSegments) * (b - a);
            const radius = getRadiusToAxis(labValue(radiusFunc, t, -8, 8), axisOffset);
            for (let j = 0; j <= radialSegments; j++) {
                const angle = (j / radialSegments) * TAU;
                if (axis === 'x') {
                    vertices.push(t, radius * Math.cos(angle), radius * Math.sin(angle));
                } else {
                    vertices.push(radius * Math.cos(angle), t, radius * Math.sin(angle));
                }
            }
        }
        const row = radialSegments + 1;
        for (let i = 0; i < tSegments; i++) {
            for (let j = 0; j < radialSegments; j++) {
                const a1 = i * row + j;
                const b1 = a1 + row;
                indices.push(a1, b1, a1 + 1, b1, b1 + 1, a1 + 1);
            }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
    }

    function graphPointForLab(func, t) {
        const lab = advancedLab;
        const value = labVisualValue(func, t);
        if (lab.mode === 'area' || lab.axis === 'x') {
            return new THREE.Vector3(t, value, 0);
        }
        return new THREE.Vector3(value, t, 0);
    }

    function buildLabSlices() {
        const lab = advancedLab;
        clearLabGroup(lab.sliceGroup);
        const halfStep = lab.sliceStep / 2;
        const axisOffset = getLabAxisOffset(lab);

        if (lab.mode === 'area') {
            const upper = [];
            const lower = [];
            for (let i = 0; i <= 150; i++) {
                const t = lab.tMin + (i / 150) * (lab.tMax - lab.tMin);
                const a = labVisualValue(lab.f, t);
                const b = labVisualValue(lab.g, t);
                upper.push(new THREE.Vector2(t, Math.max(a, b)));
                lower.push(new THREE.Vector2(t, Math.min(a, b)));
            }
            const region = makeLabShapeMesh([...upper, ...lower.reverse()], 0xfacc15, 0.26);
            if (region) {
                region.position.z = -0.03;
                lab.sliceGroup.add(region);
            }

            const sliceMat = new THREE.MeshStandardMaterial({
                color: 0xf59e0b,
                emissive: 0x4a2a00,
                transparent: true,
                opacity: 0.72,
                roughness: 0.38
            });

            if (lab.axis === 'x') {
                for (let t = lab.tMin; t <= lab.tMax - halfStep; t += lab.sliceStep) {
                    const center = t + halfStep;
                    const a = labVisualValue(lab.f, center);
                    const b = labVisualValue(lab.g, center);
                    const high = Math.max(a, b);
                    const low = Math.min(a, b);
                    const height = high - low;
                    if (height < 0.025) continue;
                    const bar = new THREE.Mesh(new THREE.BoxGeometry(lab.sliceStep * 0.82, height, 0.18), sliceMat);
                    bar.position.set(center, low + height / 2, 0.08);
                    lab.sliceGroup.add(addLabEdges(bar, 0xfff2aa));
                }
            } else {
                const yMin = Math.min(...upper.map(p => p.y), ...lower.map(p => p.y));
                const yMax = Math.max(...upper.map(p => p.y), ...lower.map(p => p.y));
                const stripStep = Math.max(0.08, (yMax - yMin) / 16);
                for (let y = yMin; y <= yMax - stripStep / 2; y += stripStep) {
                    const centerY = y + stripStep / 2;
                    const xs = [];
                    for (let i = 0; i <= 220; i++) {
                        const t = lab.tMin + (i / 220) * (lab.tMax - lab.tMin);
                        const a = labVisualValue(lab.f, t);
                        const b = labVisualValue(lab.g, t);
                        if (centerY >= Math.min(a, b) && centerY <= Math.max(a, b)) xs.push(t);
                    }
                    if (xs.length < 2) continue;
                    const minX = Math.min(...xs);
                    const maxX = Math.max(...xs);
                    const width = maxX - minX;
                    if (width < 0.025) continue;
                    const bar = new THREE.Mesh(new THREE.BoxGeometry(width, stripStep * 0.82, 0.18), sliceMat);
                    bar.position.set(minX + width / 2, centerY, 0.08);
                    lab.sliceGroup.add(addLabEdges(bar, 0xfff2aa));
                }
            }
            return;
        }

        if (lab.mode === 'polar') {
            const sectorCount = Math.max(8, Math.ceil((lab.tMax - lab.tMin) / lab.sliceStep));
            const outerInnerAtTheta = (theta) => {
                const first = Math.abs(labVisualValue(lab.f, theta, POLAR_VISUAL_LIMIT));
                const second = Math.abs(labVisualValue(lab.g, theta, POLAR_VISUAL_LIMIT));
                return { outer: Math.max(first, second), inner: Math.min(first, second) };
            };
            for (let s = 0; s < sectorCount; s++) {
                const start = lab.tMin + (s / sectorCount) * (lab.tMax - lab.tMin);
                const end = lab.tMin + ((s + 1) / sectorCount) * (lab.tMax - lab.tMin);
                const mesh = makePolarBandMesh(
                    start,
                    end,
                    outerInnerAtTheta,
                    new THREE.MeshStandardMaterial({
                        color: s % 2 ? 0x22d3ee : 0x38bdf8,
                        emissive: 0x07364a,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.55
                    }),
                    8
                );
                if (mesh) {
                    lab.sliceGroup.add(addLabEdges(mesh, 0xbef6ff));
                }
            }
            return;
        }

        if (lab.mode === 'arc') {
            const segmentMat = new THREE.MeshBasicMaterial({ color: 0xfff176 });
            const pointMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const segments = Math.max(8, Math.round((lab.tMax - lab.tMin) / lab.sliceStep));
            let previous = null;
            for (let i = 0; i <= segments; i++) {
                const t = lab.tMin + (i / segments) * (lab.tMax - lab.tMin);
                const point = new THREE.Vector3(t, labVisualValue(lab.f, t), 0.03);
                const bead = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), pointMat);
                bead.position.copy(point);
                lab.sliceGroup.add(bead);
                if (previous) lab.sliceGroup.add(createCylinderBetween(previous, point, 0.06, segmentMat));
                previous = point;
            }
            return;
        }

        for (let t = lab.tMin; t <= lab.tMax - halfStep; t += lab.sliceStep) {
            if (lab.mode === 'cs') {
                const a = labVisualValue(lab.f, t + halfStep);
                const b = labVisualValue(lab.g, t + halfStep);
                const base = Math.max(0, Math.abs(a - b));
                if (base < 0.02) continue;
                const geo = lab.axis === 'x'
                    ? new THREE.BoxGeometry(lab.sliceStep * 0.98, base, base)
                    : new THREE.BoxGeometry(base, lab.sliceStep * 0.98, base);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x3b82f6,
                    emissive: 0x0a2a5a,
                    roughness: 0.35,
                    transparent: true,
                    opacity: 0.75
                });
                const box = new THREE.Mesh(geo, mat);
                if (lab.axis === 'x') box.position.set(t + halfStep, Math.min(a, b) + base / 2, 0);
                else box.position.set(Math.min(a, b) + base / 2, t + halfStep, 0);
                lab.sliceGroup.add(addLabEdges(box, 0xcceeff));
                continue;
            }

            if (lab.mode === 'disk') {
                const radius = getBoundedRadius(lab.f, t + halfStep, 8, axisOffset);
                if (radius <= 0.01) continue;
                const geo = new THREE.CylinderGeometry(radius, radius, lab.sliceStep * 0.98, 42);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x22c55e,
                    emissive: 0x064e3b,
                    roughness: 0.3,
                    metalness: 0.2,
                    transparent: true,
                    opacity: 0.72
                });
                const cylinder = new THREE.Mesh(geo, mat);
                if (lab.axis === 'x') {
                    cylinder.rotation.z = Math.PI / 2;
                    cylinder.position.set(t + halfStep, 0, 0);
                } else {
                    cylinder.position.set(0, t + halfStep, 0);
                }
                lab.sliceGroup.add(addLabEdges(cylinder, 0xaaffaa));
                continue;
            }

            const fValue = labVisualValue(lab.f, t + halfStep);
            const gValue = labVisualValue(lab.g, t + halfStep);
            const { outer, inner } = getWasherRadii(fValue, gValue, axisOffset);
            if (outer <= 0.02 || outer <= inner) continue;
            const thickness = lab.sliceStep * 0.98;
            const washerGeo = inner <= 0.0001
                ? new THREE.CylinderGeometry(outer, outer, thickness, 64)
                : createLabHollowCylinder(outer, inner, thickness, 64, 2);
            const washerMat = new THREE.MeshStandardMaterial({
                color: 0xf97316,
                emissive: 0x4a2200,
                roughness: 0.4,
                metalness: 0.18,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.84
            });
            const washer = new THREE.Mesh(washerGeo, washerMat);
            if (lab.axis === 'x') {
                washer.rotation.z = Math.PI / 2;
                washer.position.set(t + halfStep, 0, 0);
            } else {
                washer.position.set(0, t + halfStep, 0);
            }
            lab.sliceGroup.add(addLabEdges(washer, 0xffaa77));
        }
    }

    function rebuildLabCurves() {
        const lab = advancedLab;
        clearLabGroup(lab.curveLinesGroup);
        const axisOffset = getLabAxisOffset(lab);

        if (lab.mode === 'polar') {
            const pointsF = [];
            const pointsG = [];
            let hasSecondCurve = false;
            for (let i = 0; i <= 260; i++) {
                const t = lab.tMin + (i / 260) * (lab.tMax - lab.tMin);
                const radiusF = Math.abs(labVisualValue(lab.f, t, POLAR_VISUAL_LIMIT));
                const radiusG = Math.abs(labVisualValue(lab.g, t, POLAR_VISUAL_LIMIT));
                if (radiusG > 1e-4) hasSecondCurve = true;
                pointsF.push(new THREE.Vector3(radiusF * Math.cos(t), 0.08, radiusF * Math.sin(t)));
                pointsG.push(new THREE.Vector3(radiusG * Math.cos(t), 0.1, radiusG * Math.sin(t)));
            }
            lab.curveLinesGroup.add(new THREE.Line(
                new THREE.BufferGeometry().setFromPoints(pointsF),
                new THREE.LineBasicMaterial({ color: 0xfff7ad })
            ));
            if (hasSecondCurve) {
                lab.curveLinesGroup.add(new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints(pointsG),
                    new THREE.LineBasicMaterial({ color: 0x66ccff })
                ));
            }
            const origin = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            origin.position.set(0, 0.08, 0);
            lab.curveLinesGroup.add(origin);
            return;
        }

        if (lab.mode === 'arc') {
            const points = [];
            for (let i = 0; i <= 220; i++) {
                const t = lab.tMin + (i / 220) * (lab.tMax - lab.tMin);
                points.push(new THREE.Vector3(t, labVisualValue(lab.f, t), 0));
            }
            lab.curveLinesGroup.add(new THREE.Mesh(
                new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 180, 0.14, 14, false),
                new THREE.MeshBasicMaterial({ color: 0xff4d6d })
            ));
            return;
        }

        const pointsF = [];
        const pointsG = [];
        for (let i = 0; i <= 220; i++) {
            const t = lab.tMin + (i / 220) * (lab.tMax - lab.tMin);
            pointsF.push(graphPointForLab(lab.f, t));
            pointsG.push(graphPointForLab(lab.g, t));
        }
        const curveF = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(pointsF),
            new THREE.LineBasicMaterial({ color: 0xff6666 })
        );
        const curveG = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(pointsG),
            new THREE.LineBasicMaterial({ color: 0x66ccff })
        );
        lab.curveLinesGroup.add(curveF, curveG);

        const redMat = new THREE.MeshStandardMaterial({ color: 0xff8888 });
        const blueMat = new THREE.MeshStandardMaterial({ color: 0x88aaff });
        [graphPointForLab(lab.f, lab.tMin), graphPointForLab(lab.f, lab.tMax)].forEach(point => {
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), redMat);
            sphere.position.copy(point);
            lab.curveLinesGroup.add(sphere);
        });
        [graphPointForLab(lab.g, lab.tMin), graphPointForLab(lab.g, lab.tMax)].forEach(point => {
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), blueMat);
            sphere.position.copy(point);
            lab.curveLinesGroup.add(sphere);
        });

        const mid = (lab.tMin + lab.tMax) / 2;
        const ringRad = lab.mode === 'washer'
            ? getWasherRadii(labVisualValue(lab.f, mid), labVisualValue(lab.g, mid), axisOffset).outer
            : getBoundedRadius(lab.f, mid, 8, axisOffset);
        if ((lab.mode === 'disk' || lab.mode === 'washer') && ringRad > 0.2 && ringRad < 12) {
            const ring = new THREE.Mesh(
                new THREE.TorusGeometry(ringRad, 0.045, 64, 160),
                new THREE.MeshStandardMaterial({ color: 0x77aaff, emissive: 0x225588, transparent: true, opacity: 0.35 })
            );
            if (lab.axis === 'x') {
                ring.position.set(mid, 0, 0);
                ring.rotation.y = Math.PI / 2;
            } else {
                ring.position.set(0, mid, 0);
                ring.rotation.x = Math.PI / 2;
            }
            lab.curveLinesGroup.add(ring);
        }
    }

    function initLabHelpers() {
        const lab = advancedLab;
        if (lab.helpersInitialized) return;
        const grid = new THREE.GridHelper(18, 22, 0x4b6e8f, 0x2a3a5a);
        grid.position.y = -1.6;
        grid.material.transparent = true;
        grid.material.opacity = 0.3;
        lab.scene.add(grid);

        lab.scene.add(
            new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(-0.5, 0, 0), 9.5, 0xff7777, 0.6, 0.3),
            new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, -1.2, 0), 7.2, 0x77ff77, 0.6, 0.3),
            new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, -1.2, -3), 6.5, 0x7777ff, 0.6, 0.3)
        );

        const makeLabel = (text, pos, color) => {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontSize = '18px';
            div.style.fontWeight = 'bold';
            div.style.textShadow = '1px 1px 0 #000';
            div.style.background = 'rgba(0,0,0,0.5)';
            div.style.padding = '2px 8px';
            div.style.borderRadius = '24px';
            div.style.backdropFilter = 'blur(5px)';
            const label = new CSS2DObject(div);
            label.position.copy(pos);
            lab.scene.add(label);
        };
        makeLabel('X', new THREE.Vector3(9.2, -0.3, 0), '#ffaaaa');
        makeLabel('Y', new THREE.Vector3(0, 6.4, 0), '#aaffaa');
        makeLabel('Z', new THREE.Vector3(0, -0.3, 5.6), '#aaaaff');
        makeLabel('O', new THREE.Vector3(-0.4, -0.4, -0.3), '#cccccc');
        lab.helpersInitialized = true;
    }

    function refreshAdvancedLab() {
        buildLabSlices();
        rebuildLabCurves();
        updateLabPanelState();
        updateLabInfoUI();
    }

    function updateLabPanelState() {
        const lab = advancedLab;
        const meta = labModeMeta[lab.mode] || labModeMeta.area;
        const titleEl = labEl('PanelTitle');
        const axisWrap = labEl('AxisSelector');
        const fLabel = labEl('FuncFLabel');
        const gLabel = labEl('FuncGLabel');
        const modeNote = labEl('ModeNote');
        const root = labEl('Root');
        if (titleEl) titleEl.textContent = `${meta.name} · 3D Visual Model`;
        if (axisWrap) axisWrap.style.display = meta.axis ? 'flex' : 'none';
        if (fLabel) fLabel.textContent = meta.fLabel;
        if (gLabel) gLabel.textContent = meta.gLabel;
        if (modeNote) modeNote.textContent = meta.note;
        const axisX = labEl('AxisXBtn');
        const axisY = labEl('AxisYBtn');
        if (axisX) {
            axisX.textContent = meta.axisX || 'x-axis';
            axisX.classList.toggle('active', lab.axis === 'x');
        }
        if (axisY) {
            axisY.textContent = meta.axisY || 'y-axis';
            axisY.classList.toggle('active', lab.axis === 'y');
        }
        root?.querySelectorAll('[data-lab-mode]').forEach(button => {
            button.classList.toggle('active', button.dataset.labMode === lab.mode);
        });
    }

    function setLabAxis(axis) {
        const lab = advancedLab;
        lab.axis = axis;
        labEl('AxisXBtn')?.classList.toggle('active', axis === 'x');
        labEl('AxisYBtn')?.classList.toggle('active', axis === 'y');
        refreshAdvancedLab();
        if (axis === 'y') lab.controls.target.set(0, 4.2, 0);
        else lab.controls.target.set(4.2, 1.5, 0);
        lab.controls.update();
    }

    function setLabMode(mode) {
        const presetPage = labModePresetPage[mode] || advancedLab.page || 'area';
        if (advancedLab.page === 'visualLab') {
            applyLabPreset(presetPage);
            refreshAdvancedLab();
            resetLabView();
            return;
        }
        if (presetPage !== advancedLab.page && content[presetPage]) {
            switchPage(presetPage);
            document.querySelector('.main-area')?.scrollTo({ top: 0, behavior: 'smooth' });
            return;
        }
        applyLabPreset(presetPage);
        refreshAdvancedLab();
        resetLabView();
    }

    function resetLabView() {
        const lab = advancedLab;
        if (!lab.camera || !lab.controls) return;
        if (lab.mode === 'polar') {
            lab.camera.position.set(5.8, 6.2, 8.2);
            lab.controls.target.set(0, 0.8, 0);
        } else if (lab.mode === 'arc') {
            lab.camera.position.set(8.5, 5.8, 8.2);
            lab.controls.target.set(4.1, 2.2, 0);
        } else if (lab.axis === 'x') {
            lab.camera.position.set(11, 8.5, 13.5);
            lab.controls.target.set(4.2, 1.5, 0);
        } else {
            lab.camera.position.set(9, 7, 12);
            lab.controls.target.set(0, 4.2, 0);
        }
        lab.controls.update();
    }

    function applyLabPreset(page) {
        const preset = advancedLabPresets[page] || advancedLabPresets.area;
        advancedLab.presetKey = page;
        advancedLab.mode = preset.mode;
        advancedLab.axis = preset.axis;
        advancedLab.tMin = preset.tMin ?? 0;
        advancedLab.tMax = preset.tMax ?? 8;
        advancedLab.sliceStep = preset.sliceStep ?? 0.38;
        advancedLab.csDepth = preset.csDepth ?? 1;
        advancedLab.axisOffset = preset.axisOffset ?? 0;
        const presetF = parseLabFunction(preset.f);
        const presetG = parseLabFunction(preset.g);
        if (presetF && !validateLabFunctionOnInterval(presetF, advancedLab.tMin, advancedLab.tMax)) advancedLab.f = presetF;
        if (presetG && !validateLabFunctionOnInterval(presetG, advancedLab.tMin, advancedLab.tMax)) advancedLab.g = presetG;
        const fInput = labEl('FuncF');
        const gInput = labEl('FuncG');
        const error = labEl('EqErrorMsg');
        if (fInput) fInput.value = preset.f;
        if (gInput) gInput.value = preset.g;
        if (error) error.style.display = 'none';
        labEl('AxisXBtn')?.classList.toggle('active', preset.axis === 'x');
        labEl('AxisYBtn')?.classList.toggle('active', preset.axis === 'y');
        updateLabPanelState();
    }

    function destroyAdvancedLab() {
        const lab = advancedLab;
        if (lab.animationFrame) cancelAnimationFrame(lab.animationFrame);
        lab.animationFrame = null;
        lab.observer?.disconnect?.();
        lab.observer = null;
        lab.controls?.dispose?.();
        if (lab.scene) {
            disposeLabObject(lab.scene);
            lab.scene.clear();
        }
        lab.renderer?.dispose?.();
        lab.renderer?.domElement?.remove?.();
        lab.labelRenderer?.domElement?.remove?.();
        lab.initialized = false;
        lab.page = null;
        lab.prefix = '';
        lab.scene = null;
        lab.camera = null;
        lab.renderer = null;
        lab.labelRenderer = null;
        lab.controls = null;
        lab.sliceGroup = null;
        lab.curveLinesGroup = null;
        lab.helpersInitialized = false;
    }

    function resizeAdvancedLab() {
        const lab = advancedLab;
        const viewport = labEl('Viewport');
        if (!lab.renderer || !lab.camera || !viewport) return;
        const rect = viewport.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;
        lab.renderer.setSize(rect.width, rect.height);
        lab.labelRenderer?.setSize(rect.width, rect.height);
        lab.camera.aspect = rect.width / rect.height;
        lab.camera.updateProjectionMatrix();
    }

    function initAdvancedLab(page = 'area') {
        if (!advancedLabPresets[page]) return;
        if (advancedLab.initialized && advancedLab.page === page) {
            resizeAdvancedLab();
            return;
        }
        destroyAdvancedLab();
        const lab = advancedLab;
        lab.page = page;
        lab.prefix = `lab-${page}-`;
        const viewport = labEl('Viewport');
        if (!viewport) return;
        lab.initialized = true;
        viewport.innerHTML = '';
        lab.scene = new THREE.Scene();
        lab.scene.background = new THREE.Color(0x0a0f1e);
        lab.scene.fog = new THREE.FogExp2(0x0a0f1e, 0.008);
        lab.camera = new THREE.PerspectiveCamera(48, 1, 0.1, 500);
        lab.camera.position.set(11, 8.5, 13.5);
        lab.sliceGroup = new THREE.Group();
        lab.curveLinesGroup = new THREE.Group();

        try {
            lab.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        } catch (error) {
            viewport.innerHTML = '<div class="lab-fallback"><div><h2>WebGL is unavailable</h2><p>This advanced model requires WebGL. Open it in Chrome or Safari, or enable hardware acceleration.</p></div></div>';
            return;
        }
        lab.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        lab.renderer.shadowMap.enabled = true;
        viewport.appendChild(lab.renderer.domElement);

        lab.labelRenderer = new CSS2DRenderer();
        lab.labelRenderer.domElement.style.position = 'absolute';
        lab.labelRenderer.domElement.style.inset = '0';
        lab.labelRenderer.domElement.style.pointerEvents = 'none';
        viewport.appendChild(lab.labelRenderer.domElement);

        lab.controls = new OrbitControls(lab.camera, lab.renderer.domElement);
        lab.controls.enableDamping = true;
        lab.controls.dampingFactor = 0.06;
        lab.controls.rotateSpeed = 1.0;
        lab.controls.zoomSpeed = 1.2;
        lab.controls.panSpeed = 0.8;
        lab.controls.target.set(4.2, 1.5, 0);

        lab.scene.add(new THREE.AmbientLight(0x404060, 0.55));
        const mainLight = new THREE.DirectionalLight(0xfff2e0, 1.2);
        mainLight.position.set(6, 12, 5);
        lab.scene.add(mainLight);
        [[0x4488ff, -2, 4, 5, 0.4], [0xffaa66, 5, 2, -6, 0.35], [0xffaa88, 8, 3, -4, 0.5]].forEach(([color, x, y, z, intensity]) => {
            const light = new THREE.PointLight(color, intensity);
            light.position.set(x, y, z);
            lab.scene.add(light);
        });

        lab.scene.add(lab.sliceGroup, lab.curveLinesGroup);
        applyLabPreset(page);
        initLabHelpers();

        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(1400 * 3);
        for (let i = 0; i < 1400; i++) {
            starPos[i * 3] = (Math.random() - 0.5) * 220;
            starPos[i * 3 + 1] = (Math.random() - 0.5) * 120;
            starPos[i * 3 + 2] = (Math.random() - 0.5) * 130 - 50;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        lab.scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x88aadd, size: 0.07, transparent: true, opacity: 0.5 })));

        labEl('Root')?.querySelectorAll('[data-lab-mode]').forEach(button => {
            button.onclick = () => setLabMode(button.dataset.labMode);
        });
        labEl('BtnReset').onclick = resetLabView;
        labEl('AxisXBtn').onclick = () => setLabAxis('x');
        labEl('AxisYBtn').onclick = () => setLabAxis('y');
        labEl('UpdateEqBtn').onclick = () => {
            const fInput = labEl('FuncF');
            const gInput = labEl('FuncG');
            const newF = parseLabFunction(fInput.value);
            const newG = parseLabFunction(gInput.value);
            const error = labEl('EqErrorMsg');
            if (!newF || !newG) {
                error.textContent = `⚠️ ${!newF ? 'f(t) is invalid ' : ''}${!newG ? 'g(t) is invalid' : ''}. Keeping the previous functions.`;
                error.style.display = 'block';
                setTimeout(() => error.style.display = 'none', 3000);
                return;
            }
            const fIssue = validateLabFunctionOnInterval(newF, lab.tMin, lab.tMax);
            const gIssue = validateLabFunctionOnInterval(newG, lab.tMin, lab.tMax);
            if (fIssue || gIssue) {
                error.textContent = `⚠️ ${fIssue ? `f(t)：${fIssue}` : ''}${gIssue ? ` g(t)：${gIssue}` : ''}`;
                error.style.display = 'block';
                setTimeout(() => error.style.display = 'none', 5200);
                return;
            }
            lab.f = newF;
            lab.g = newG;
            error.style.display = 'none';
            refreshAdvancedLab();
        };
        labEl('FuncF').addEventListener('keypress', e => { if (e.key === 'Enter') labEl('UpdateEqBtn').click(); });
        labEl('FuncG').addEventListener('keypress', e => { if (e.key === 'Enter') labEl('UpdateEqBtn').click(); });

        resizeAdvancedLab();
        resetLabView();
        refreshAdvancedLab();
        lab.observer = new ResizeObserver(resizeAdvancedLab);
        lab.observer.observe(viewport);

        const animateLab = () => {
            lab.animationFrame = requestAnimationFrame(animateLab);
            if (!lab.renderer) return;
            lab.controls.update();
            lab.renderer.render(lab.scene, lab.camera);
            lab.labelRenderer.render(lab.scene, lab.camera);
        };
        animateLab();
    }

    function initAreaScene() {
        const d = createScene('areaCanvas');
        if (!d) return;
        const { scene, extra } = d;
        const shape = new THREE.Shape();
        for (let i = 0; i <= 40; i++) { const t = i / 40; shape.lineTo(t, t); }
        for (let i = 40; i >= 0; i--) { const t = i / 40; shape.lineTo(t, t * t); }
        shape.closePath();
        scene.add(new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide, transparent: true, opacity: 0.25 })));
        const upPts = [], loPts = [];
        for (let t = 0; t <= 1; t += 0.02) { upPts.push(new THREE.Vector3(t, t, 0)); loPts.push(new THREE.Vector3(t, t * t, 0)); }
        scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(upPts), 100, 0.02, 8, false), new THREE.MeshBasicMaterial({ color: 0x2563eb })));
        scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(loPts), 100, 0.02, 8, false), new THREE.MeshBasicMaterial({ color: 0xdc2626 })));
        const vertG = new THREE.Group(), horizG = new THREE.Group();
        for (let x = 0.08; x < 1; x += 0.14) {
            const h = x - x * x;
            if (h < 0.02) continue;
            const bar = new THREE.Mesh(new THREE.BoxGeometry(0.08, h, 0.1), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
            bar.position.set(x, x * x + h / 2, 0); vertG.add(bar);
        }
        for (let y = 0.08; y < 1; y += 0.14) {
            const w = Math.sqrt(y) - y;
            if (w < 0.02) continue;
            const bar = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, 0.1), new THREE.MeshBasicMaterial({ color: 0x3b82f6 }));
            bar.position.set(y + w / 2, y, 0); horizG.add(bar);
        }
        horizG.visible = false;
        scene.add(vertG); scene.add(horizG);
        extra.vertG = vertG; extra.horizG = horizG; extra.current = 'vertical';
        sceneData.area = d;
    }

    function initDiskScene() {
        const d = createScene('diskCanvas');
        if (!d) return;
        const { scene, extra } = d;
        const cone = new THREE.Mesh(new THREE.ConeGeometry(2, 2, 48), new THREE.MeshPhysicalMaterial({ color: 0x8b5cf6, transparent: true, opacity: 0.45 }));
        cone.rotation.z = Math.PI / 2; cone.position.x = 1; scene.add(cone);
        const diskG = new THREE.Group();
        function createDisks(n) {
            while (diskG.children.length) diskG.remove(diskG.children[0]);
            const dx = 2 / n;
            for (let i = 0; i < n; i++) {
                const x = dx * (i + 0.5), r = x;
                if (r < 0.02) continue;
                const disk = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dx * 0.9, 32), new THREE.MeshPhysicalMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.7 }));
                disk.rotation.z = Math.PI / 2; disk.position.x = x;
                diskG.add(disk);
            }
        }
        createDisks(12); scene.add(diskG);
        extra.diskG = diskG; extra.createDisks = createDisks; extra.visible = true;
        sceneData.disk = d;
    }

    function initWasherScene() {
        const d = createScene('washerCanvas');
        if (!d) return;
        const { scene, extra } = d;
        const outer = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 2, 64), new THREE.MeshPhysicalMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.35 }));
        outer.rotation.z = Math.PI / 2; outer.position.x = 1; scene.add(outer);
        const inner = new THREE.Mesh(new THREE.ConeGeometry(2, 2, 48), new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 }));
        inner.rotation.z = Math.PI / 2; inner.position.x = 1; scene.add(inner);
        const ringG = new THREE.Group();
        for (let x = 0.2; x < 2; x += 0.3) {
            const torus = new THREE.Mesh(new THREE.TorusGeometry((2 + x) / 2, (2 - x) / 2, 16, 32), new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.7 }));
            torus.position.x = x; torus.rotation.y = Math.PI / 2; ringG.add(torus);
        }
        ringG.visible = false; scene.add(ringG);
        extra.ringG = ringG; extra.ringsVisible = false;
        sceneData.washer = d;
    }

    function initCrossScene() {
        const d = createScene('crossCanvas');
        if (!d) return;
        const { scene, extra } = d;
        scene.add(new THREE.Mesh(new THREE.BoxGeometry(4, 2, 2), new THREE.MeshPhysicalMaterial({ color: 0x10b981, transparent: true, opacity: 0.35 })));
        const cg = new THREE.Group();
        function createSections(hx) {
            while (cg.children.length) cg.remove(cg.children[0]);
            [-1.6, -0.8, 0, 0.8, 1.6].forEach(x => {
                const mat = new THREE.MeshBasicMaterial({ color: Math.abs(x - hx) < 0.05 ? 0xfbbf24 : 0xef4444, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
                const p = new THREE.Mesh(new THREE.PlaneGeometry(2.05, 2.05), mat);
                p.position.x = x; p.rotation.y = Math.PI / 2; cg.add(p);
            });
        }
        createSections(0); scene.add(cg);
        extra.cg = cg; extra.createSections = createSections; extra.visible = true;
        sceneData.cross = d;
    }

    function initPolarScene() {
        const d = createScene('polarCanvas');
        if (!d) return;
        const { scene, extra } = d;
        scene.add(new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshBasicMaterial({ color: 0xe8ecf1, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })).rotateX(-Math.PI / 2));
        const curvePts = [];
        for (let t = 0; t <= 2 * Math.PI; t += 0.02) { const r = 1 + Math.cos(t); curvePts.push(new THREE.Vector3(r * Math.cos(t), 0, r * Math.sin(t))); }
        scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(curvePts), 200, 0.03, 8, false), new THREE.MeshBasicMaterial({ color: 0x7c3aed })));
        const sectorG = new THREE.Group();
        for (let t = 0; t < 2 * Math.PI; t += 0.3) {
            const r = 1 + Math.cos(t);
            const shape = new THREE.Shape();
            shape.moveTo(0, 0); shape.lineTo(r * Math.cos(t), r * Math.sin(t)); shape.lineTo(r * Math.cos(t + 0.2), r * Math.sin(t + 0.2)); shape.closePath();
            const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: 0xf59e0b, side: THREE.DoubleSide, transparent: true, opacity: 0.4 }));
            mesh.rotation.x = -Math.PI / 2; sectorG.add(mesh);
        }
        sectorG.visible = true; scene.add(sectorG);
        extra.sectorG = sectorG; extra.sectorsVisible = true;
        sceneData.polar = d;
    }

    function initArcScene() {
        const d = createScene('arcCanvas');
        if (!d) return;
        const { scene, extra } = d;
        const pts = [];
        for (let x = 0; x <= 4; x += 0.1) pts.push(new THREE.Vector3(x, Math.pow(x, 1.5), 0));
        scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 100, 0.05, 8, false), new THREE.MeshStandardMaterial({ color: 0x7c3aed })));
        const segG = new THREE.Group();
        function createSegments(n) {
            while (segG.children.length) segG.remove(segG.children[0]);
            const dx = 4 / n;
            for (let i = 0; i < n; i++) {
                const x1 = i * dx, y1 = Math.pow(x1, 1.5), x2 = (i + 1) * dx, y2 = Math.pow(x2, 1.5);
                segG.add(createCylinderBetween(
                    new THREE.Vector3(x1, y1, 0),
                    new THREE.Vector3(x2, y2, 0),
                    0.03,
                    new THREE.MeshBasicMaterial({ color: 0xef4444 })
                ));
            }
        }
        createSegments(12); scene.add(segG);
        extra.segG = segG; extra.createSegments = createSegments;
        sceneData.arc = d;
    }

    function buildLessonPageHTML(key, val) {
        const meta = lessonMeta[key];

        const hasLab = Boolean(advancedLabPresets[key]);
        const videoEmbed = buildVideoHTML(key);
        const modelEmbed = hasLab ? buildAdvancedLabHTML(key) : '';
        const formulaBlock = val.formula ? `<section class="lesson-section"><h3>Key Formula</h3><div class="formula">${val.formula}</div></section>` : '';

            <section class="lesson-section quiz">
                <h3>Practice Types</h3>
                ${val.quiz.map((q, i) => `

    function buildToolPageHTML(key, val) {

        const prefix = `lab-${key}-`;

                <div class="advanced-lab" id="${prefix}Root">

                            <button class="lab-mode-btn lab-mode-area" data-lab-mode="area">📏 Area</button>
                            <button class="lab-mode-btn lab-mode-disk" data-lab-mode="disk">🟢 Disk</button>
                            <button class="lab-mode-btn lab-mode-washer" data-lab-mode="washer">🟠 Washer</button>

                            <div class="lab-tip">
                                <span>🖱️ Drag to rotate / right-drag to pan / scroll to zoom</span>

                    <div class="lab-info-card">

                        📈 Integral: <span id="${prefix}FormulaTxt">V = π∫₀⁸ f(x)² dx</span><br>
                        💡 <span id="${prefix}MetricLabel">Approximate volume</span>: <span id="${prefix}VolumeValue" class="lab-volume-value">0.00</span> <span id="${prefix}UnitLabel">cubic units</span>
                        <div id="${prefix}WarningMsg" class="lab-warning-msg"></div>

                    <div class="lab-note">🧩 Independent page model | live integration | custom equations</div>

    function buildVideoHTML(key) {
        const video = videoLinks[key];
        if (!video) return '';
        const title = video.title || 'Teaching Video';
        const keyword = encodeURIComponent(video.keyword || title);
        const searchUrl = `https://search.bilibili.com/all?keyword=${keyword}`;

        if (video.local) {
            return `
                <div class="video-wrap">
                    <video src="${video.local}" controls preload="metadata"></video>
                </div>
                <div class="video-tools">
                    <span class="video-note">Using local video file: ${video.local}</span>
                </div>`;
        }

        if (video.bilibili) {
            const { bvid, cid, page = 1 } = video.bilibili;
            const playerUrl = `https://player.bilibili.com/player.html?isOutside=true&bvid=${bvid}&cid=${cid}&p=${page}&autoplay=0&danmaku=0&high_quality=1`;
            const watchUrl = `https://www.bilibili.com/video/${bvid}/?p=${page}`;
            return `
                <div class="video-wrap">
                    <iframe title="${title}" src="${playerUrl}" allow="fullscreen; autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
                <div class="video-tools">
                    <a href="${watchUrl}" target="_blank" rel="noopener">Open Bilibili Page</a>
                    <a href="${searchUrl}" target="_blank" rel="noopener">Search Related Videos</a>
                    <span class="video-note">Using embedded Bilibili playback: ${video.source || title}. If the video area is blank, the current browser may block third-party players. Chrome or Safari usually works better.</span>
                </div>`;
        }

        if (video.embed) {
            return `
                <div class="video-wrap">
                    <iframe title="${title}" src="${video.embed}" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
                <div class="video-tools">
                    <a href="${video.embed}" target="_blank" rel="noopener">Open in New Window</a>
                    <span class="video-note">If the embedded player is blank, the platform may be blocking this browser or local file page.</span>
                </div>`;
        }

        if (video.youtube) {
            const watchUrl = `https://www.youtube.com/watch?v=${video.youtube}`;
            const embedUrl = `https://www.youtube-nocookie.com/embed/${video.youtube}?rel=0&modestbranding=1`;
            return `
                <div class="video-wrap">
                    <iframe title="${title}" src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
                <div class="video-tools">
                    <a href="${watchUrl}" target="_blank" rel="noopener">Open Original Video</a>
                    <a href="${searchUrl}" target="_blank" rel="noopener">Backup Search</a>
                    <span class="video-note">This video is from YouTube. If it cannot play here, use the backup links or configure a local mp4 / iframe URL in videoLinks.</span>
                </div>`;
        }

        return '';
    }

    function buildHTML() {
        const main = document.getElementById('mainArea');
        let html = buildHomePageHTML() + buildLearnPageHTML() + buildVisualLabPageHTML();
        lessonKeys.forEach(key => {
            html += buildLessonPageHTML(key, content[key]);
        });
        ['practice', 'formulaMap', 'mistakes'].forEach(key => {
            html += buildToolPageHTML(key, content[key]);
        });
        main.innerHTML = html;
    }

    buildHTML();

    setTimeout(() => {
        addControlButtons();
        switchPage('home');
        if (window.MathJax?.typesetPromise) MathJax.typesetPromise();
    }, 150);

    function addControlButtons() {
        const ctrls = {
            area: `<button class="accent" onclick="toggleAreaSlice()">🔁 Switch Slice Direction (<span id="sliceLabel">Vertical</span>)</button>`,
            disk: `<button class="accent" onclick="toggleDisks()">🔘 Show/Hide Disks</button> <span style="color:#475569;">Disk count <strong id="diskLabel">12</strong></span> <input type="range" min="4" max="30" value="12" step="2" oninput="updateDiskCount(this.value)">`,
            washer: `<button class="accent" onclick="toggleWasherCutaway()">🔍 Show/Hide Washer Section</button>`,
            cross: `<button class="accent" onclick="toggleCrossSections()">📋 Show/Hide Cross Sections</button> <span style="color:#475569;">Section x=<strong id="crossPosLabel">0.0</strong></span> <input type="range" min="-2" max="2" value="0" step="0.1" oninput="updateCrossPos(this.value)">`,
            polar: `<button class="bc-btn" onclick="togglePolarSectors()">🔁 Show/Hide Sectors</button>`,
            arc: `<span style="color:#475569;">Polyline segments <strong id="arcSegLabel">12</strong></span> <input type="range" min="4" max="40" value="12" step="2" oninput="updateArcSegments(this.value)">`
        };
        for (let [key, html] of Object.entries(ctrls)) {
            const el = document.getElementById(key + 'Controls');
            if (el) el.innerHTML = html;
        }
    }

    window.switchPage = function(page) {
        document.querySelectorAll('.card').forEach(c => {
            c.classList.remove('active');
            c.style.display = 'none';
            c.style.visibility = 'hidden';
            c.style.opacity = '0';
        });
        const target = document.querySelector(`.card[data-page="${page}"]`);
        if (target) {
            target.classList.add('active');
            target.style.display = 'block';
            target.style.visibility = 'visible';
            target.style.opacity = '1';
        }
        document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
        const primaryPage = lessonKeys.includes(page) ? 'learn' : page;
        const navLink = document.querySelector(`.nav a[data-page="${primaryPage}"]`);
        if (navLink) navLink.classList.add('active');
        if (advancedLabPresets[page]) initAdvancedLab(page);
        else destroyAdvancedLab();
        target?.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => {
            resizeAdvancedLab();
            Object.values(sceneData).forEach(resizeScene);
            Object.values(compatScenes).forEach(d => d.resize());
        }, 100);
    };

    window.addEventListener('resize', () => {
        resizeAdvancedLab();
        Object.values(sceneData).forEach(resizeScene);
        Object.values(compatScenes).forEach(d => d.resize());
    });

    document.getElementById('topNav').addEventListener('click', (e) => {
        const link = e.target.closest('a[data-page]');
        if (!link) return;
        e.preventDefault();
        const page = link.dataset.page;
        if (page) switchPage(page);
    });

    document.addEventListener('click', (e) => {
        const filterBtn = e.target.closest('.exam-filter-btn[data-exam-module]');
        if (filterBtn) {
            const bank = filterBtn.closest('.explanation-section') || document;
            const moduleId = filterBtn.dataset.examModule;
            bank.querySelectorAll('.exam-filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn === filterBtn);
            });
            bank.querySelectorAll('.exam-module[data-exam-module-panel]').forEach(panel => {
                panel.hidden = panel.dataset.examModulePanel !== moduleId;
            });
            return;
        }

        const revealBtn = e.target.closest('[data-answer-toggle]');
        if (revealBtn) {
            const card = revealBtn.closest('.exam-card');
            const panel = card?.querySelector('.exam-answer-panel');
            if (!panel) return;
            const willShow = panel.hidden;
            panel.hidden = !willShow;
            revealBtn.textContent = willShow ? 'Hide Answer & Explanation' : 'Show Answer & Explanation';
        }
    });

    const demoUserName = document.getElementById('demoUserName');
    const demoAuthState = document.getElementById('demoAuthState');
    const demoAvatar = document.getElementById('demoAvatar');
    const demoStatusText = document.getElementById('demoStatusText');
    const setDemoSignedIn = (signedIn) => {
        if (demoUserName) demoUserName.textContent = signedIn ? 'Alex Student' : 'Guest Viewer';
        if (demoAuthState) demoAuthState.textContent = signedIn ? 'Signed in · Demo mode' : 'Signed out · Frontend only';
        if (demoAvatar) demoAvatar.textContent = signedIn ? 'AS' : 'GV';
        if (demoStatusText) demoStatusText.textContent = signedIn ? 'All Systems Nominal' : 'Guest Preview Active';
    };
    document.getElementById('demoSignIn')?.addEventListener('click', () => setDemoSignedIn(true));
    document.getElementById('demoLogOut')?.addEventListener('click', () => setDemoSignedIn(false));
    document.getElementById('demoSettings')?.addEventListener('click', () => {
        if (demoStatusText) demoStatusText.textContent = 'Settings Panel Is Demo Only';
    });
    document.querySelectorAll('.fake-icon-button').forEach(button => {
        button.addEventListener('click', () => {
            if (demoStatusText) demoStatusText.textContent = 'Demo Toolbar Action';
        });
    });

    document.getElementById('mainArea').addEventListener('click', (e) => {
        const jump = e.target.closest('[data-jump]');
        if (!jump) return;
        e.preventDefault();
        const page = jump.dataset.jump;
        if (page) switchPage(page);
    });

    window.toggleAnswer = (button) => {
        const ex = button.nextElementSibling;
        if (!ex) return;
        const isHidden = getComputedStyle(ex).display === 'none';
        ex.style.display = isHidden ? 'block' : 'none';
        button.textContent = isHidden ? 'Hide Answer' : 'Show Answer';
    };

    window.toggleAreaSlice = () => {
        const d = sceneData.area; if (!d) return;
        d.extra.current = d.extra.current === 'vertical' ? 'horizontal' : 'vertical';
        d.extra.vertG.visible = d.extra.current === 'vertical';
        d.extra.horizG.visible = d.extra.current === 'horizontal';
        const lbl = document.getElementById('sliceLabel'); if (lbl) lbl.textContent = d.extra.current === 'vertical' ? 'Vertical' : 'Horizontal';
    };
    window.toggleDisks = () => { const d = sceneData.disk; if (!d) return; d.extra.visible = !d.extra.visible; d.extra.diskG.visible = d.extra.visible; };
    window.updateDiskCount = (v) => { const d = sceneData.disk; if (!d) return; d.extra.createDisks(parseInt(v)); d.extra.diskG.visible = d.extra.visible; document.getElementById('diskLabel').textContent = v; };
    window.toggleWasherCutaway = () => { const d = sceneData.washer; if (!d) return; d.extra.ringsVisible = !d.extra.ringsVisible; d.extra.ringG.visible = d.extra.ringsVisible; };
    window.toggleCrossSections = () => { const d = sceneData.cross; if (!d) return; d.extra.visible = !d.extra.visible; d.extra.cg.visible = d.extra.visible; };
    window.updateCrossPos = (v) => { const d = sceneData.cross; if (!d) return; d.extra.createSections(parseFloat(v)); d.extra.cg.visible = d.extra.visible; document.getElementById('crossPosLabel').textContent = parseFloat(v).toFixed(1); };
    window.togglePolarSectors = () => { const d = sceneData.polar; if (!d) return; d.extra.sectorsVisible = !d.extra.sectorsVisible; d.extra.sectorG.visible = d.extra.sectorsVisible; };
    window.updateArcSegments = (v) => { const d = sceneData.arc; if (!d) return; d.extra.createSegments(parseInt(v)); document.getElementById('arcSegLabel').textContent = v; };

</script>
</body>
</html>
