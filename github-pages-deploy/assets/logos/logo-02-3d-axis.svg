<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Logo option 02 - 3D Axis</title>
  <desc id="desc">A geometric 3D coordinate cube with a golden integral mark and Mathematical Observatory wordmark.</desc>
  <defs>
    <linearGradient id="cubeFaceA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2CB1BC"/>
      <stop offset="1" stop-color="#145DA0"/>
    </linearGradient>
    <linearGradient id="cubeFaceB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#0B3D6E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0B1320" flood-opacity=".35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="56" y="76" width="164" height="164" rx="26" fill="#0B1320" stroke="#D7CCB6" stroke-width="2"/>
    <path d="M138 97 194 130v63l-56 33-56-33v-63z" fill="none" stroke="#D7CCB6" stroke-width="3" opacity=".55"/>
    <path d="M138 97v63l56 33v-63z" fill="url(#cubeFaceA)" opacity=".7"/>
    <path d="M138 160v66l-56-33v-63z" fill="#145DA0" opacity=".75"/>
    <path d="M138 160 82 130l56-33 56 33z" fill="url(#cubeFaceB)" opacity=".78"/>
    <path d="M86 210 204 114" stroke="#C9A227" stroke-width="7" stroke-linecap="round"/>
    <path d="M105 210h91M105 210v-88M105 210l54-35" stroke="#F5F0E1" stroke-width="4" stroke-linecap="round"/>
    <path d="M160 116c-14 24 12 40-4 65-7 12-20 21-39 28" fill="none" stroke="#C9A227" stroke-width="10" stroke-linecap="round"/>
    <circle cx="204" cy="114" r="8" fill="#2CB1BC"/>
  </g>
  <g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <text x="256" y="130" fill="#F8FAFC" font-size="50" font-weight="900">3D Integral</text>
    <text x="258" y="172" fill="#C9A227" font-size="31" font-weight="900" letter-spacing=".6">Observatory</text>
    <text x="258" y="215" fill="#D7CCB6" font-size="21" font-weight="700">Coordinate thinking for AP Calculus</text>
  </g>
