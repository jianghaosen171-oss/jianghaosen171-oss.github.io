<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Logo option 08 - U28 Monogram</title>
  <desc id="desc">A bold U28 monogram with calculus curve and observatory wordmark.</desc>
  <defs>
    <linearGradient id="monogram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F0E1"/>
      <stop offset=".5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#2CB1BC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0B1320" flood-opacity=".35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="56" y="76" width="164" height="164" rx="26" fill="#0B1320" stroke="#D7CCB6" stroke-width="2"/>
    <path d="M91 111v52c0 34 18 53 47 53s47-19 47-53v-52" fill="none" stroke="url(#monogram)" stroke-width="16" stroke-linecap="round"/>
    <path d="M96 180c28-40 64-45 111-20" fill="none" stroke="#2CB1BC" stroke-width="6" stroke-linecap="round"/>
    <text x="95" y="160" fill="#F5F0E1" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="900">28</text>
    <path d="M93 205h93" stroke="#C9A227" stroke-width="5" stroke-linecap="round"/>
    <text x="187" y="222" fill="#C9A227" font-family="Georgia, serif" font-size="36" font-weight="700">∫</text>
  </g>
  <g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <text x="256" y="136" fill="#F8FAFC" font-size="52" font-weight="900">U28</text>
    <text x="355" y="136" fill="#C9A227" font-size="30" font-weight="900">Observatory</text>
    <text x="258" y="186" fill="#F8FAFC" font-size="43" font-weight="900">Calculus System</text>
    <text x="258" y="225" fill="#D7CCB6" font-size="21" font-weight="700">Current U28 mark, made sharper</text>
  </g>
</svg>
