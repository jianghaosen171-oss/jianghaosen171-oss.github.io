      <stop offset="0" stop-color="#2CB1BC"/>
      <stop offset=".55" stop-color="#145DA0"/>
      <stop offset="1" stop-color="#0B3D6E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F0E1"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0B1320" flood-opacity=".35"/>
