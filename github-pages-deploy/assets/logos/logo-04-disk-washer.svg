<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Logo option 04 - Disk and Washer</title>
  <desc id="desc">A stacked disk and washer logo for volumes of revolution.</desc>
  <defs>
