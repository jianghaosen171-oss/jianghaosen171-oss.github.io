    <ellipse cx="146" cy="174" rx="34" ry="58" fill="#145DA0" opacity=".74" transform="rotate(-12 146 174)"/>
    <ellipse cx="173" cy="162" rx="40" ry="65" fill="url(#gold)" opacity=".92" transform="rotate(-12 173 162)"/>
    <ellipse cx="173" cy="162" rx="16" ry="26" fill="#0B1320" opacity=".95" transform="rotate(-12 173 162)"/>
    <path d="M88 210h112" stroke="#C9A227" stroke-width="5" stroke-linecap="round"/>
    <path d="M97 210c38-75 74-100 108-76" fill="none" stroke="#2CB1BC" stroke-width="6" stroke-linecap="round"/>
    <text x="105" y="129" fill="#F5F0E1" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="900">V</text>
    <text x="124" y="130" fill="#C9A227" font-family="Georgia, serif" font-size="36" font-weight="700">=π∫</text>
