<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">Slim mark option 01 - Star Orbit</title>
  <desc id="desc">A slimmer angular star mark with an observatory orbit.</desc>
  <defs>
    <linearGradient id="goldStroke" x1="92" y1="50" x2="268" y2="304">
      <stop offset="0" stop-color="#F5F0E1"/>
      <stop offset=".48" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8F6D13"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0B1320" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect x="42" y="42" width="276" height="276" rx="34" fill="#0B1320" stroke="#C9A227" stroke-width="3"/>
  <g filter="url(#shadow)" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <g transform="translate(180 180)">
      <path d="M0-118 38-58 18-38" stroke="url(#goldStroke)" stroke-width="16"/>
      <path d="M0-118 38-58 18-38" stroke="#D7CCB6" stroke-width="16" transform="rotate(60)"/>
      <path d="M0-118 38-58 18-38" stroke="#2CB1BC" stroke-width="16" transform="rotate(120)"/>
      <path d="M0-118 38-58 18-38" stroke="#C9A227" stroke-width="16" transform="rotate(180)"/>
      <path d="M0-118 38-58 18-38" stroke="#D7CCB6" stroke-width="16" transform="rotate(240)"/>
      <path d="M0-118 38-58 18-38" stroke="#145DA0" stroke-width="16" transform="rotate(300)"/>
    </g>
    <ellipse cx="180" cy="180" rx="116" ry="42" stroke="#2CB1BC" stroke-width="7" opacity=".9" transform="rotate(-18 180 180)"/>
    <ellipse cx="180" cy="180" rx="89" ry="28" stroke="#F5F0E1" stroke-width="5" opacity=".72" transform="rotate(-18 180 180)"/>
  </g>
  <circle cx="270" cy="148" r="8" fill="#C9A227"/>
  <circle cx="88" cy="216" r="7" fill="#2CB1BC"/>
</svg>
