    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F0E1"/>
      <stop offset=".54" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8A6B11"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
