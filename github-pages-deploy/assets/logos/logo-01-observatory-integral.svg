<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Logo option 01 - Observatory Integral</title>
  <desc id="desc">A dark observatory badge with a golden integral orbit and Mathematical Observatory wordmark.</desc>
